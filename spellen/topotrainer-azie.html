<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topotrainer Azië</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
.back{display:inline-block;font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:700}
.back:hover{color:var(--ink)}
/* Layout: a blind wall map is the hero; question strip above it, controls as a compact toolbar, passport as a drawer below */
:root{
  --sea:#d3e5ee; --sea-deep:#bcd6e3; --land:#ecefe0; --border:#c3cbb2;
  --ink:#1d2a2e; --muted:#5b6b6f; --paper:#f7f9f6; --line:#d9e0dc;
  --accent:#c8255f; --accent-soft:#c8255f22;
  --river:#2a76b5; --mount:#8b5a2b; --city:#1d2a2e;
  --good:#2b8a3e; --good-soft:#2b8a3e1f; --bad:#d6336c; --bad-soft:#e0313118;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0f1f27; --sea-deep:#0b1820; --land:#26322d; --border:#3b4a42;
  --ink:#e6eee9; --muted:#9aaba5; --paper:#141c1f; --line:#2b3a36;
  --accent:#ff6f9f; --accent-soft:#ff6f9f2a;
  --river:#5eaee8; --mount:#d0a173; --city:#e6eee9;
  --good:#5fd07a; --good-soft:#5fd07a22; --bad:#ff7a9c; --bad-soft:#ff7a9c22; color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0f1f27; --sea-deep:#0b1820; --land:#26322d; --border:#3b4a42;
  --ink:#e6eee9; --muted:#9aaba5; --paper:#141c1f; --line:#2b3a36;
  --accent:#ff6f9f; --accent-soft:#ff6f9f2a;
  --river:#5eaee8; --mount:#d0a173; --city:#e6eee9;
  --good:#5fd07a; --good-soft:#5fd07a22; --bad:#ff7a9c; --bad-soft:#ff7a9c22; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4vw,2.4rem);line-height:1;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pp-btn{display:flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:700}
.pp-btn svg{width:26px;height:26px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:flex;background:var(--sea);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:700;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px #0002}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"] i{background:var(--accent)}
.qbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:58px;padding:10px 14px;border-radius:14px;background:var(--sea);}
.qtext{font-size:1.05rem;min-width:0}
.qtext b{font-family:var(--display);font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
.qtext .kind{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.qbar.good{background:var(--good-soft)} .qbar.bad{background:var(--bad-soft)}
.prog{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.dots{display:flex;gap:4px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--paper);border:1.5px solid var(--border)}
.dots span.g{background:var(--good);border-color:var(--good)} .dots span.b{background:var(--bad);border-color:var(--bad)} .dots span.c{border-color:var(--ink)}
.btn{border:0;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--border)}
.mapbox{position:relative;border-radius:16px;overflow:hidden;background:var(--sea);border:1px solid var(--line);touch-action:none}
#map{cursor:crosshair}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:1.2rem;font-weight:700;display:grid;place-items:center}
.hint{position:absolute;left:12px;bottom:10px;font-size:.78rem;color:var(--muted);background:color-mix(in srgb,var(--paper) 80%,transparent);padding:3px 8px;border-radius:6px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:700px){.answers{grid-template-columns:repeat(4,minmax(0,1fr))}}
.answers button{border:1.5px solid var(--border);background:var(--paper);border-radius:12px;padding:12px 10px;font-weight:700;font-size:1rem}
.answers button:hover{border-color:var(--ink)}
.answers button.g{background:var(--good);border-color:var(--good);color:var(--paper)}
.answers button.b{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.typerow{display:flex;gap:8px;flex-wrap:wrap}
.typerow input{flex:1 1 220px;min-width:0;font:inherit;font-size:1.1rem;padding:11px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--paper);color:var(--ink)}
/* map styles */
.sphere{fill:var(--sea)}
.grat{fill:none;stroke:var(--sea-deep);stroke-width:.6;vector-effect:non-scaling-stroke}
.land{fill:var(--land);stroke:var(--border);stroke-width:.5;vector-effect:non-scaling-stroke}
.region-hl{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke}
.region-hl.good{fill:var(--good-soft);stroke:var(--good)}
.sahara{fill:url(#sand);stroke:none}
.river{fill:none;stroke:var(--river);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.mount{fill:none;stroke:var(--mount);stroke-width:5;stroke-dasharray:2 4;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.85}
.line-hl{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.85}
.line-hl.good{stroke:var(--good)}
.city{fill:var(--city);stroke:var(--paper);vector-effect:non-scaling-stroke;stroke-width:1.5}
.water{fill:none;stroke:var(--river);stroke-width:1.5;stroke-dasharray:3 2;vector-effect:non-scaling-stroke}
.pt-hl{fill:none;stroke:var(--accent);stroke-width:3;vector-effect:non-scaling-stroke}
.pt-hl.good{stroke:var(--good)}
.pulse{animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:1;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
.miss{fill:var(--bad);opacity:.9}
.lbl{font-family:var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-weight:700}
.lbl.land{fill:var(--muted);font-weight:700}
.lbl.big{font-family:var(--display);text-transform:uppercase;letter-spacing:.12em;fill:var(--muted);font-weight:800}
.lbl.wat{fill:var(--river);font-style:italic;stroke:var(--sea)}
.lbl.mnt{fill:var(--mount)}
/* passport */
.passport{border-top:1.5px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:14px}
.passport h2{font-family:var(--display);font-weight:800;font-size:1.4rem;margin:0}
.passport p{margin:0;color:var(--muted);max-width:65ch}
.stamps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.stamp{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}
.stamp svg{width:110px;height:110px}
.stamp .cnt{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.itemlist{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.itemlist span{font-size:.72rem;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.itemlist span.k{border-color:var(--good);color:var(--good)}
.itemlist span.h{border-color:var(--border);color:var(--ink)}
.done{display:flex;flex-direction:column;gap:6px}
.reset{align-self:flex-start;font-size:.85rem}
.toast[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:700;box-shadow:0 6px 20px #0003;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px)}

/* one-screen layout: map fills the viewport, question panel beside it on wide screens */
.wrap{max-width:1500px}
.screen{display:flex;flex-direction:column;gap:12px}
.stage{display:flex;flex-direction:column;gap:12px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.mapbox svg{display:block;width:100%;height:auto}
@media (min-width:900px){
  .wrap{padding-block:10px 32px}
  .screen{height:calc(100dvh - 10px);min-height:540px;gap:10px}
  header{align-items:center}
  h1{font-size:clamp(1.4rem,2.2vw,1.9rem)}
  .sub{margin-top:2px;font-size:.85rem}
  .stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,24vw,320px);gap:14px;padding-bottom:12px}
  .mapbox{min-height:0;height:100%}
  .mapbox svg{height:100%}
  .side{overflow-y:auto}
  .side .qbar{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:10px}
  .side .prog{flex-wrap:wrap}
  .side .answers{grid-template-columns:1fr}
  .side .typerow input{flex-basis:100%}
}
</style>
</head>
<body>

<div class="wrap">
<div class="screen">
  <a class="back" href="../index.html">← Alle spellen</a>
  <header>
    <div>
      <h1>Topotrainer <span>Azië</span></h1>
      <p class="sub">Cito 100 Topo · landen, hoofdsteden en Plus Topo · 36 plekken</p>
    </div>
    <button class="pp-btn" id="ppBtn" aria-label="Naar mijn paspoort">
      <svg viewBox="0 0 26 26" aria-hidden="true"><rect x="4" y="2" width="18" height="22" rx="2.5" fill="var(--accent)"/><circle cx="13" cy="11" r="4.2" fill="none" stroke="var(--paper)" stroke-width="1.4"/><path d="M8.8 11h8.4M13 6.8c-1.6 2.4-1.6 6 0 8.4M13 6.8c1.6 2.4 1.6 6 0 8.4" stroke="var(--paper)" stroke-width="1" fill="none"/><rect x="8" y="18.5" width="10" height="1.5" rx=".75" fill="var(--paper)"/></svg>
      <span id="ppCount">0 van 3 stempels</span>
    </button>
  </header>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Oefenvorm" id="modes">
      <button data-mode="bekijk" aria-pressed="true">Bekijken</button>
      <button data-mode="wijs" aria-pressed="false">Aanwijzen</button>
      <button data-mode="kies" aria-pressed="false">Kiezen</button>
      <button data-mode="typ" aria-pressed="false">Typen</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Wat oefen je?"></div>
  </div>

  <div class="stage">
  <div class="mapbox">
    <svg id="map" viewBox="0 0 960 640" role="img" aria-label="Blinde kaart van Azië">
      <defs>
        <pattern id="sand" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".9" fill="var(--mount)" opacity=".55"/><circle cx="4.5" cy="4.5" r=".7" fill="var(--mount)" opacity=".4"/></pattern>
      </defs>
      <g id="world"></g>
    </svg>
    <div class="zoom">
      <button id="zin" aria-label="Inzoomen">+</button>
      <button id="zout" aria-label="Uitzoomen">−</button>
      <button id="zreset" aria-label="Hele wereld" style="font-size:.8rem">⟲</button>
    </div>
    <div class="hint" id="hint">Knijp of scroll om in te zoomen, sleep om te schuiven</div>
  </div>
  <aside class="side">
    <div class="qbar" id="qbar">
      <div class="qtext" id="qtext"></div>
      <div class="prog" id="prog"></div>
    </div>
    <div id="below"></div>
  </aside>
  </div>
</div>

  <section class="passport" id="passport">
    <h2>Mijn paspoort</h2>
    <p>Een plek telt als <b>gekend</b> als je hem twee keer achter elkaar goed hebt. Ken je alle plekken van een groep, dan krijg je de stempel.</p>
    <div class="stamps" id="stamps"></div>
    <button class="btn ghost reset" id="resetBtn">Paspoort leegmaken</button>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

/* ---------- map ---------- */
const W=960,H=640;
const svg=d3.select('#map'), world=d3.select('#world');
const proj=d3.geoAzimuthalEqualArea().rotate([-90,-38]).clipAngle(80).fitExtent([[0,0],[W,H]],{type:'MultiPoint',coordinates:[[26,30],[150,40],[90,78],[92,-10],[30,12],[145,-8],[40,60],[148,60]]});
const path=d3.geoPath(proj);
world.append('path').attr('class','sphere').attr('d',path({type:'Sphere'}));
world.append('path').attr('class','grat').attr('d',path(d3.geoGraticule10()));
const gLand=world.append('g');
gLand.selectAll('path').data(GEO.land).join('path').attr('class','land').attr('d',d=>path(d.g));
const gHL=world.append('g');      // region highlight
const gFeat=world.append('g');    // rivers, mountains, cities
const gLineHL=world.append('g');
const gPtHL=world.append('g');
const gLbl=world.append('g');
const gMiss=world.append('g');

const lineGeo=i=>({type:'LineString',coordinates:i.c});
ITEMS.filter(i=>i.t==='mount').forEach(i=>gFeat.append('path').attr('class','mount').attr('d',path(lineGeo(i))));
ITEMS.filter(i=>i.t==='line').forEach(i=>gFeat.append('path').attr('class','river').attr('d',path(lineGeo(i))));
const ptNodes={};
ITEMS.filter(i=>i.t==='point'||i.t==='water').forEach(i=>{
  const [x,y]=proj(i.c);
  ptNodes[i.id]=gFeat.append('circle').attr('class',i.t==='water'?'water':'city').attr('cx',x).attr('cy',y).attr('data-r',i.t==='water'?9:3.4);
});
// precompute geometry for hit tests
ITEMS.forEach(i=>{
  if(i.t==='region'){i.geom=GEO.regions[i.r]; i.area=path.area(i.geom); i.cen=proj(i.lab);}
  else if(i.t==='point'||i.t==='water'){i.xy=proj(i.c)}
  else {i.pts=i.c.map(c=>proj(c))}
});

let k=1;
const zoom=d3.zoom().scaleExtent([1,14]).translateExtent([[0,0],[W,H]]).on('zoom',e=>{
  k=e.transform.k; world.attr('transform',e.transform); rescale();
});
svg.call(zoom).on('dblclick.zoom',null);
function rescale(){
  gFeat.selectAll('circle').attr('r',function(){return (+this.getAttribute('data-r'))/Math.sqrt(k)});
  gPtHL.selectAll('circle').attr('r',function(){return (+this.getAttribute('data-r'))/k});
  gMiss.selectAll('circle').attr('r',5/k);
  gLbl.selectAll('text').attr('font-size',function(){return (+this.getAttribute('data-fs'))/Math.pow(k,.8)})
    .attr('dx',function(){return (+this.getAttribute('data-dx'))/Math.pow(k,.8)})
    .style('stroke-width',(3/Math.pow(k,.8))+'px');
}
function resetZoom(){if(d3.zoomTransform(svg.node()).k===1&&!d3.zoomTransform(svg.node()).x)return; svg.transition().duration(matchMedia('(prefers-reduced-motion: reduce)').matches?0:450).call(zoom.transform,d3.zoomIdentity)}
const zb=(f)=>svg.transition().duration(300).call(zoom.scaleBy,f);
document.getElementById('zin').onclick=()=>zb(1.8);
document.getElementById('zout').onclick=()=>zb(1/1.8);
document.getElementById('zreset').onclick=()=>svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity);

/* ---------- hit testing ---------- */
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function hits(i,m,ll){ // m: map coords, distance thresholds in screen px
  if(i.t==='point') return Math.hypot(m[0]-i.xy[0],m[1]-i.xy[1])*k<26;
  if(i.t==='water') return Math.hypot(m[0]-i.xy[0],m[1]-i.xy[1])*k<40;
  if(i.t==='line'||i.t==='mount'){let d=1e9;for(let j=1;j<i.pts.length;j++)d=Math.min(d,segDist(m,i.pts[j-1],i.pts[j]));return d*k<20}
  return (ll&&d3.geoContains(i.geom,ll)) || Math.hypot(m[0]-i.cen[0],m[1]-i.cen[1])*k<18;
}
function whatIsAt(m,ll){
  const order=[...ITEMS].sort((a,b)=>rank(a)-rank(b));
  return order.find(i=>hits(i,m,ll));
}
function rank(i){return i.t==='point'?0:i.t==='line'||i.t==='mount'?1:i.t==='water'?3:2+ (i.area||0)/1e6}

/* ---------- drawing helpers ---------- */
function clearHL(){gHL.selectAll('*').remove();gLineHL.selectAll('*').remove();gPtHL.selectAll('*').remove();gMiss.selectAll('*').remove()}
function highlight(i,cls=''){
  if(i.t==='region') gHL.append('path').attr('class','region-hl '+cls).attr('d',path(i.geom));
  else if(i.t==='line'||i.t==='mount') gLineHL.append('path').attr('class','line-hl '+cls).attr('d',path(lineGeo(i)));
  else {
    const [x,y]=i.xy, r=i.t==='water'?26:14;
    gPtHL.append('circle').attr('class','pt-hl '+cls).attr('cx',x).attr('cy',y).attr('data-r',r);
    if(!cls&&!matchMedia('(prefers-reduced-motion: reduce)').matches) gPtHL.append('circle').attr('class','pt-hl pulse').attr('cx',x).attr('cy',y).attr('data-r',r);
  }
  rescale();
}
function drawLabels(list){
  gLbl.selectAll('*').remove();
  list.forEach(i=>{
    const [x,y]=proj(i.lab); const big=false; const pt=i.t==='point';
    gLbl.append('text').attr('class','lbl'+(pt?'':' land'))
      .attr('x',x).attr('y',y).attr('dy','.35em')
      .attr('text-anchor',pt?'start':'middle').attr('data-dx',pt?6:0)
      .attr('data-fs',pt?11:11.5).text(i.n);
  });
  rescale();
}

/* ---------- UI state ---------- */
const $=id=>document.getElementById(id);
if(!Array.isArray(store.cats)||!store.cats.every(c=>CATS.some(x=>x.id===c)))store.cats=CATS.map(c=>c.id);
let mode=store.mode, round=null;
const chipsEl=$('chips');
CATS.forEach(c=>{
  const b=document.createElement('button'); b.className='chip'; b.dataset.cat=c.id;
  b.innerHTML=`<i></i>${c.n}`; b.onclick=()=>{
    const on=store.cats.includes(c.id);
    if(on&&store.cats.length===1) return toast('Kies minstens één groep');
    store.cats=on?store.cats.filter(x=>x!==c.id):[...store.cats,c.id]; save(); syncChips(); start();
  }; chipsEl.appendChild(b);
});
function syncChips(){chipsEl.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',store.cats.includes(b.dataset.cat)))}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;store.mode=mode;save();syncModes();start()});
function syncModes(){document.querySelectorAll('#modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode))}
const pool=()=>ITEMS.filter(i=>store.cats.includes(i.cat));
const kindOf=i=>i.kind;

function start(){
  clearHL(); $('qbar').className='qbar'; $('below').innerHTML='';
  if(mode==='bekijk'){
    round=null; drawLabels(pool());
    $('qtext').innerHTML=`<span class="kind">Bekijken</span>Zoek de namen op de kaart. Klaar? Kies <b style="font-size:1.05rem">Aanwijzen</b>, <b style="font-size:1.05rem">Kiezen</b> of <b style="font-size:1.05rem">Typen</b>.`;
    $('prog').innerHTML=`${pool().length} plekken`;
    return;
  }
  drawLabels([]);
  round={q:pickRound(pool()),idx:0,res:[],retry:new Set(),locked:false};
  ask();
}
/* Which places to ask in a round.
   Priority: places she got wrong, places never asked, places right only once.
   Places she already knows (2x in a row right) only come back for a short review,
   oldest first, and fill a whole round only when everything is known. */
function weightOf(i){
  const s=store.items[i.id];
  if(!s||(!s.ok&&!s.bad)) return 3;                 // nog nooit gevraagd
  if(s.streak===0) return 4+Math.min(s.bad,3);      // laatst fout
  return 2;                                         // 1x goed, nog niet gekend
}
function weightedPick(list,n,w){
  const rest=[...list], out=[];
  while(out.length<n&&rest.length){
    const tot=rest.reduce((a,i)=>a+w(i),0); let r=Math.random()*tot, j=0;
    while(j<rest.length-1&&(r-=w(rest[j]))>0) j++;
    out.push(rest.splice(j,1)[0]);
  }
  return out;
}
function oldestKnown(list,n){
  const sorted=[...list].sort((a,b)=>(store.items[a.id]?.last||0)-(store.items[b.id]?.last||0));
  return weightedPick(sorted.slice(0,Math.max(n*3,4)),n,()=>1);
}
function pickRound(p){
  const MAX=10, kn=p.filter(i=>known(i.id)), nk=p.filter(i=>!known(i.id));
  if(!nk.length) return d3.shuffle(oldestKnown(kn,Math.min(MAX,kn.length)));
  const review=Math.min(kn.length, nk.length>=8?1:2);
  const learn=weightedPick(nk,Math.min(MAX-review,nk.length),weightOf);
  return d3.shuffle([...learn,...oldestKnown(kn,review)]);
}
function progress(){
  const r=round, total=r.q.length;
  $('prog').innerHTML=`<div class="dots">${r.q.map((_,j)=>`<span class="${r.res[j]===true?'g':r.res[j]===false?'b':j===r.idx?'c':''}"></span>`).join('')}</div>${Math.min(r.idx+1,total)}/${total}`;
}
function ask(){
  const r=round; clearHL(); r.locked=false; $('qbar').className='qbar';
  resetZoom();
  if(r.idx>=r.q.length) return finish();
  const i=r.q[r.idx]; progress();
  if(mode==='wijs'){
    $('qtext').innerHTML=`<span class="kind">Wijs aan · ${kindOf(i)}</span><b>${i.n}</b>`;
    $('below').innerHTML='';
  } else {
    highlight(i);
    $('qtext').innerHTML=`<span class="kind">${kindOf(i)==="land"?"Welk":"Welke"} ${kindOf(i)} is dit?</span><b>?</b>`;
    if(mode==='kies'){
      const same=ITEMS.filter(x=>x.kind===i.kind&&x!==i), other=ITEMS.filter(x=>x!==i&&x.t===i.t&&!same.includes(x));
      const opts=d3.shuffle([...d3.shuffle(same).slice(0,3)]);
      while(opts.length<3) opts.push(d3.shuffle(other.filter(o=>!opts.includes(o)))[0]);
      const all=d3.shuffle([i,...opts]);
      $('below').innerHTML=`<div class="answers">${all.map(o=>`<button data-id="${o.id}">${o.n}</button>`).join('')}</div>`;
      $('below').querySelectorAll('button').forEach(b=>b.onclick=()=>{
        if(r.locked)return; const ok=b.dataset.id===i.id;
        b.classList.add(ok?'g':'b'); if(!ok) $('below').querySelector(`[data-id="${i.id}"]`).classList.add('g');
        answer(ok);
      });
    } else {
      $('below').innerHTML=`<form class="typerow" id="tf"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Typ de naam…" aria-label="Naam"><button class="btn">Controleer</button><button type="button" class="btn ghost" id="tskip">Weet ik niet</button></form>`;
      const inp=$('ti'); setTimeout(()=>inp.focus({preventScroll:true}),50);
      $('tf').onsubmit=e=>{e.preventDefault(); if(r.locked)return; if(!inp.value.trim())return;
        const res=checkTyped(inp.value,i); answer(res>0, res===1?'Goed gespeld is het: '+i.n:null)};
      $('tskip').onclick=()=>{if(!r.locked)answer(false)};
    }
  }
}
svg.on('click',ev=>{
  if(mode!=='wijs'||!round||round.locked||round.idx>=round.q.length) return;
  const t=d3.zoomTransform(svg.node()); const p=d3.pointer(ev,svg.node()); const m=t.invert(p); const ll=proj.invert(m);
  const i=round.q[round.idx];
  if(hits(i,m,ll)) return answer(true);
  gMiss.append('circle').attr('class','miss').attr('cx',m[0]).attr('cy',m[1]); rescale();
  const got=whatIsAt(m,ll);
  answer(false, got?`Daar ligt ${got.n}.`:null);
});
function answer(ok,extra){
  const r=round, i=r.q[r.idx]; r.locked=true;
  const s=st(i.id); if(ok){s.ok++;s.streak++}else{s.bad++;s.streak=0} s.last=Date.now(); save();
  if(r.res[r.idx]===undefined) r.res[r.idx]=ok;
  gHL.selectAll('*').remove();gLineHL.selectAll('*').remove();gPtHL.selectAll('*').remove();
  highlight(i,'good');
  if(mode!=='wijs') $('qtext').querySelector('b').textContent=i.n;
  $('qbar').className='qbar '+(ok?'good':'bad');
  const head=$('qtext').querySelector('.kind');
  head.textContent=ok?(extra?'Bijna perfect!':pick(['Goed zo!','Klopt!','Top!','Precies!'])):'Niet goed';
  if(extra) $('qtext').insertAdjacentHTML('beforeend',`<span class="kind" style="text-transform:none;letter-spacing:0;font-size:.85rem;margin-top:2px">${extra}</span>`);
  if(!ok && !r.retry.has(i.id)){ r.retry.add(i.id); r.q.splice(Math.min(r.idx+3,r.q.length),0,i); }
  progress(); updatePassport();
  const go=()=>{r.idx++; ask()};
  if(ok) setTimeout(go,mode==='wijs'?900:1100);
  else {
    const nb=document.createElement('button'); nb.className='btn'; nb.textContent='Volgende'; nb.onclick=go;
    $('prog').appendChild(nb); nb.focus({preventScroll:true});
  }
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function finish(){
  const r=round, n=r.res.length, good=r.res.filter(x=>x).length;
  clearHL(); drawLabels([]);
  $('qbar').className='qbar '+(good>=n*0.8?'good':'');
  $('qtext').innerHTML=`<span class="kind">Klaar!</span><b>${good} van de ${n} goed</b>`;
  $('prog').innerHTML='';
  const wrong=r.q.filter((q,j)=>r.res[j]===false).filter((v,j,a)=>a.indexOf(v)===j);
  $('below').innerHTML=`<div class="done">${wrong.length?`<p style="margin:0">Nog even oefenen: ${wrong.map(w=>'<b>'+w.n+'</b>').join(', ')}</p>`:'<p style="margin:0">Alles in één keer goed!</p>'}<p style="margin:0;color:var(--muted)">${(()=>{const p=pool(),k=p.filter(i=>known(i.id)).length;return k===p.length?'Je kent alle '+p.length+' plekken. De volgende ronde is herhaling.':'Gekend: '+k+' van '+p.length+'. Nog te leren: '+(p.length-k)+'.'})()}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="again">Nog een ronde</button></div></div>`;
  $('again').onclick=start;
}

/* ---------- typed answer checking ---------- */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^(de|het|the)\s+/,'').replace(/[^a-z]/g,'');
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function checkTyped(v,i){ // 2 = exact, 1 = small typo, 0 = wrong
  const x=norm(v); const names=[i.n,...i.al].map(norm);
  if(names.includes(x)) return 2;
  if(names.some(nm=>{const d=lev(x,nm);return (nm.length>=5&&d<=1)||(nm.length>=9&&d<=2)})) return 1;
  return 0;
}

/* ---------- passport ---------- */
const ICON={
  wd:'<circle cx="0" cy="0" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M-13 0h26M0-13c-6 7-6 19 0 26M0-13c6 7 6 19 0 26" fill="none" stroke="currentColor" stroke-width="1.8"/>',
  la:'<path d="M-14 -4l8-7 7 3 7-4 6 6-3 9-8 6-5-2-6 4-6-6z" fill="currentColor" opacity=".9"/>',
  st:'<path d="M-15 12V0h6v-8h7V4h4V-12h7V12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>',
  wa:'<path d="M-15-4q4-5 7.5 0t7.5 0 7.5 0 7.5 0M-15 5q4-5 7.5 0t7.5 0 7.5 0 7.5 0" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
  ri:'<path d="M-10-14c10 4-8 10 2 15s-6 9 4 13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>',
  ge:'<path d="M-16 11l9-17 6 9 5-13 12 21z" fill="currentColor" opacity=".9"/>',
  gb:'<path d="M-15 10q8-12 15-5t15-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><circle cx="8" cy="-8" r="4" fill="currentColor"/>',
};
const TILT={la:-7,hs:6,pl:-4};
ICON.hs=ICON.st; ICON.pl='<path d="M0-15l4.4 9 9.9 1.4-7.2 7 1.7 9.9L0 7.6l-8.8 4.7 1.7-9.9-7.2-7 9.9-1.4z" fill="currentColor"/>';
function stampSVG(c,earned){
  const id='sp'+c.id, col=earned?'var(--accent)':'var(--border)';
  return `<svg viewBox="-55 -55 110 110" aria-hidden="true" style="color:${col}"><g transform="rotate(${earned?TILT[c.id]:0})" opacity="${earned?.95:.8}">
   <circle r="50" fill="none" stroke="currentColor" stroke-width="2.5" ${earned?'':'stroke-dasharray="4 5"'}/>
   <circle r="44" fill="none" stroke="currentColor" stroke-width="1"/>
   <circle r="24" fill="none" stroke="currentColor" stroke-width="1"/>
   <path id="${id}" d="M-34 0a34 34 0 1 1 68 0a34 34 0 1 1 -68 0" fill="none"/>
   <text font-family="Bricolage Grotesque,system-ui,sans-serif" font-weight="800" font-size="9.5" letter-spacing="1.6" fill="currentColor"><textPath href="#${id}" startOffset="0">${c.n.toUpperCase()} · AZIË · </textPath></text>
   <g>${earned?ICON[c.id]:'<text text-anchor="middle" dy=".35em" font-size="16" font-weight="700" fill="currentColor" font-family="system-ui">?</text>'}</g></g></svg>`;
}
let lastEarned=null;
function updatePassport(){
  let earned=0;
  $('stamps').innerHTML=CATS.map(c=>{
    const its=ITEMS.filter(i=>i.cat===c.id), kn=its.filter(i=>known(i.id)).length, ok=kn===its.length;
    if(ok) earned++;
    return `<div class="stamp">${stampSVG(c,ok)}<b>${c.n}</b><span class="cnt">${kn} van ${its.length} gekend</span>
      <div class="itemlist">${its.map(i=>`<span class="${known(i.id)?'k':(store.items[i.id]?.ok?'h':'')}">${i.n}</span>`).join('')}</div></div>`;
  }).join('');
  $('ppCount').textContent=`${earned} van ${CATS.length} stempels`;
  if(lastEarned!==null && earned>lastEarned) toast('Nieuwe stempel in je paspoort!');
  lastEarned=earned;
}
$('ppBtn').onclick=()=>$('passport').scrollIntoView({behavior:'smooth'});
let armed=false;
$('resetBtn').onclick=()=>{
  if(!armed){armed=true;$('resetBtn').textContent='Zeker weten? Klik nog een keer';setTimeout(()=>{armed=false;$('resetBtn').textContent='Paspoort leegmaken'},4000);return}
  store.items={}; save(); armed=false; $('resetBtn').textContent='Paspoort leegmaken'; lastEarned=null; updatePassport(); toast('Paspoort is leeg');
};
let tt;function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2600)}

syncChips(); syncModes(); updatePassport(); start();
</script>
