<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katzenkram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gluten:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
.back{display:inline-block;font:inherit;font-size:.9rem;color:var(--muted);text-decoration:none;padding:4px 0}
.back:hover,.back:focus-visible{color:var(--ink);text-decoration:underline}
.backbar{max-width:640px;margin:0 auto;padding-top:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
/* Layout: één kolom-app; boven het kattenhuis, daaronder voortgang en oefenen. Quiz vervangt de huiskamer. */
:root{
  --bg:#eef1e6;        /* kattenkruid-papier */
  --card:#fbfcf6;
  --ink:#2f2340;       /* pruim */
  --muted:#6c6478;
  --line:#d6d9c8;
  --accent:#e9a31c;    /* kattenoog-goud */
  --accent-ink:#2f2340;
  --leaf:#4f8a4a;      /* catnip */
  --bad:#c2453b;
  --rare:#c79a1e;
  --display:"Gluten", "Comic Sans MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d1726;--card:#2a2236;--ink:#f1ecf6;--muted:#b3a9c0;--line:#3d3349;
  --accent:#f2b63a;--accent-ink:#1d1726;--leaf:#7cc174;--bad:#ef7a6f;--rare:#f2cf5a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1726;--card:#2a2236;--ink:#f1ecf6;--muted:#b3a9c0;--line:#3d3349;
  --accent:#f2b63a;--accent-ink:#1d1726;--leaf:#7cc174;--bad:#ef7a6f;--rare:#f2cf5a;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}
h1,h2,.display{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:2rem;line-height:1.1}
h2{font-size:1.35rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fish{display:flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px}
.fish svg{width:22px;height:22px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* kattenhuis */
.house{border-radius:18px;overflow:hidden;border:1.5px solid var(--line);background:var(--card);line-height:0;position:relative}
.house svg.scene{width:100%;height:auto;display:block}
.mover{transition:transform 2.6s ease-in-out;cursor:pointer;outline:none}
.mover:focus-visible .catbody{stroke:var(--accent);stroke-width:4}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:sway 2.6s ease-in-out infinite alternate}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(11deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.svgheart{transform-box:fill-box;transform-origin:center;animation:svgfloat 1.4s ease-out forwards;pointer-events:none}
@keyframes svgfloat{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-34px)}}
.bfly{transform-box:fill-box;transform-origin:center;animation:flap .35s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleX(.3)}}
.bpath{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(60px,-25px)}100%{transform:translate(120px,8px)}}
.glow{animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
.namebubble{font-family:var(--display);font-size:13px;pointer-events:none}
.houseinfo{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--muted);margin-top:6px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.item{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.item .fr{font-style:italic;color:var(--muted);font-size:.85rem;line-height:1.2}
.item .nlname{font-weight:700;line-height:1.2}
.item button{font:inherit;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:10px;padding:6px 8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:700}
.item button svg{width:18px;height:18px}
.item button:disabled{background:var(--line);color:var(--muted);cursor:default}
.item.owned{border-color:var(--leaf)}
.item.owned .state{color:var(--leaf);font-weight:700;font-size:.9rem}
.item .state{font-size:.85rem;color:var(--muted)}
.cat{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:inherit;color:inherit;position:relative}
.cat svg{width:92px;height:92px;transition:transform .2s}
.cat:hover svg,.cat:focus-visible svg{transform:translateY(-4px) rotate(-3deg)}
.cat:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
.cat .nm{font-family:var(--display);font-size:.95rem;line-height:1}
.cat.rare .nm{color:var(--rare)}
.heart{position:absolute;top:0;left:50%;font-size:22px;pointer-events:none;animation:float 1s ease-out forwards;color:var(--bad)}
@keyframes float{from{opacity:1;transform:translate(-50%,10px)}to{opacity:0;transform:translate(-50%,-40px)}}
.empty-room{align-self:center;text-align:center;max-width:32ch}

/* voortgang */
.paws{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.paw{width:34px;height:34px}
.paw path,.paw ellipse{fill:var(--line)}
.paw.on path,.paw.on ellipse{fill:var(--accent)}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.bar div{background:var(--bg);border-radius:10px;padding:6px 4px;text-align:center;font-size:.8rem;line-height:1.2}
.bar b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.bar div:last-child{background:color-mix(in srgb,var(--leaf) 22%, var(--bg))}

.btn{font:inherit;font-family:var(--display);font-weight:700;font-size:1.15rem;border:0;border-radius:14px;
  padding:12px 20px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%, #000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%, #000)}
.btn:focus-visible,.ghost:focus-visible,.opt:focus-visible,.key:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ghost{font:inherit;background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mode{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.prompt{font-family:var(--display);font-size:2.2rem;line-height:1.15;text-align:center;padding:18px 0 6px;word-break:break-word}
.hint{text-align:center;color:var(--muted);margin-bottom:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-size:1.1rem;padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.good{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 20%, var(--bg))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%, var(--bg))}
input[type=text]{width:100%;font:inherit;font-size:1.4rem;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.key{font:inherit;font-size:1.1rem;min-width:40px;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.speak{background:none;border:1.5px solid var(--line);border-radius:999px;width:40px;height:40px;cursor:pointer;color:var(--ink);display:inline-grid;place-items:center}
.speak svg{width:20px;height:20px}
.fb{border-radius:14px;padding:14px;margin-top:14px}
.fb.ok{background:color-mix(in srgb,var(--leaf) 18%, var(--card))}
.fb.no{background:color-mix(in srgb,var(--bad) 12%, var(--card))}
.fb .big{font-family:var(--display);font-size:1.3rem}
.answer{font-size:1.5rem;font-weight:700}
.answer mark{background:color-mix(in srgb,var(--accent) 45%, transparent);color:inherit;border-radius:4px;padding:0 2px}
.dots{display:flex;gap:4px}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.done{background:var(--accent)}

/* modals */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%, transparent);display:grid;place-items:center;z-index:20;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.modal{background:var(--card);border-radius:22px;padding:22px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.modal svg.bigcat{width:170px;height:170px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;font-size:.92rem;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] span{color:var(--accent-ink)}
.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tag{font-family:var(--body);font-size:.7em;font-style:italic;color:var(--muted);font-weight:400}
.prompt.zin{font-size:1.55rem}
.opts.one{grid-template-columns:1fr}
.btn:disabled{opacity:.5;cursor:default}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lvl{font-variant-numeric:tabular-nums;font-weight:700}
.tablewrap{overflow-x:auto}
.note{font-size:.85rem;color:var(--muted)}
/* garderobe */
.modal.wide{max-width:480px;max-height:92vh;max-height:92dvh;overflow-y:auto;text-align:left;align-items:stretch}
.modal svg{overflow:visible}
.wardrobe-top{display:flex;gap:14px;align-items:center}
.wardrobe-top svg{width:120px;height:120px;flex:none}
.wardrobe-top .nmrow{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.wardrobe-top input{font-size:1.15rem;padding:8px 10px}
.slot h3{font-family:var(--display);font-size:1.05rem;margin:6px 0 6px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.witem{border:1.5px solid var(--line);border-radius:14px;background:var(--bg);padding:6px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.witem svg{width:64px;height:64px}
.witem .nlname{font-weight:700;font-size:.88rem;line-height:1.15}
.witem .fr{font-style:italic;color:var(--muted);font-size:.78rem;line-height:1.15}
.witem button{margin-top:4px;font:inherit;font-size:.85rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:3px;border-radius:10px;padding:5px 8px;border:0;width:100%;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.witem button svg{width:16px;height:16px}
.witem button.wearing{background:var(--leaf);color:#fff}
.witem button.plain{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.witem button:disabled{background:var(--line);color:var(--muted);cursor:default}
.witem.on{border-color:var(--leaf)}
.item button svg path,.witem button svg path{fill:currentColor}
.item button svg circle,.witem button svg circle{fill:var(--accent)}
.shopgroup summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.05rem;padding:6px 0;list-style-position:inside}
.shopgroup + .shopgroup{margin-top:4px;border-top:1px solid var(--line);padding-top:4px}
@media (max-width:480px){
  body{font-size:16px}
  .wrap{padding-block:10px 32px;gap:14px}
  h1{font-size:1.55rem}
  .top{flex-wrap:nowrap}
  .panel{padding:14px;border-radius:16px}
  .prompt{font-size:1.8rem;padding:8px 0 4px}
  .prompt.zin{font-size:1.25rem}
  .hint{margin-bottom:8px;font-size:.92rem}
  .keys{gap:5px;margin:8px 0}
  .key{min-width:0;flex:1 0 calc(12.5% - 5px);padding:8px 0;font-size:1.05rem}
  .opt{padding:12px 10px;font-size:1rem}
  .fb{padding:12px;margin-top:10px}
  .btn{padding:11px 18px}
  .qhead .ghost{padding:6px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Duitse variant: groenblauw accent */
:root{--accent:#2f8f7a;--accent-ink:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#5cc4a8;--accent-ink:#1d1726}}
:root[data-theme="dark"]{--accent:#5cc4a8;--accent-ink:#1d1726}
</style>
</head>
<body>
<div class="backbar"><a class="back" href="../index.html">← Alle spellen</a></div>
<div class="wrap" id="app"></div>

<script>
/*@@CONFIG*/
const LANG = {
  code:"de", name:"Duits", adj:"Duitse", title:"Katzenkram", key:"katzenkram-de-v1",
  voice:/^de([-_]|$)/i, voicePref:/de[-_]DE/i, voiceNames:/google|natural|premium|enhanced|anna|petra|markus|helena|katja|conrad/i,
  keys:["ä","ö","ü","ß","Ä","Ö","Ü"],
  art:/^(der |die |das )/, toVerb:false, caseSensitive:true,
  praise:["Sehr gut!","Super!","Toll!","Prima!","Miauw, goed zo!"],
  party:"Katzenparty!", shop:"Der Katzenladen", allText:"met lidwoorden, hoofdletters en umlauts",
  note:"Bakje 1: Duits → Nederlands kiezen · 2: Nederlands → Duits kiezen · 3 en 4: zelf typen, met lidwoord, hoofdletter en umlauts · 5: gekend. Woorden uit de linkerkolom (begrijpen) hoef je alleen te herkennen.",
  names:["Minka","Mieze","Brezel","Strudel","Krümel","Flocke","Wuschel","Pfötchen","Zimt","Mohn","Keks","Knödel","Lebkuchen","Rosine","Strolch","Pünktchen","Kringel","Honig","Sternchen","Schnurri","Bärli","Trüffel","Muffin","Grisu"],
};
/* ===== WOORDENLIJST (Duits, Wörterliste A en B) =====
   [duits, nederlands, vlaggen, alternatieven]; r = alleen begrijpen */
const GROUPS = [
 {id:"l1a", name:"Lijst 1 · A", items:[
  ["der Ratschlag, die Ratschläge", "het advies", "r"],["die Abwechslung", "de afwisseling", "r"],["die Liste", "de lijst", "r"],["die Sprachnachricht", "het ingesproken bericht", "r"],["die mobilen Daten", "de mobiele data", "r"],["auf lautlos schalten", "op stil zetten", "r"],["das Ziel im Auge behalten", "het doel voor ogen houden", "r"],["Prioritäten setzen", "prioriteiten stellen", "r"],["Vokabeln abfragen", "woorden overhoren", "r"],["Vokabeln pauken", "woorden stampen", "r"],["die Erinnerung", "de herinnering"],["die Ruhe", "de rust"],["die Zeit", "de tijd"],["das Handy", "de mobiele telefoon"],["das Treffen, die Treffen", "de ontmoeting", "", ["das Treffen"]],["anfangen", "beginnen"],["einerseits ... andererseits", "enerzijds ... anderzijds"],["einschalten – ausschalten", "aanzetten – uitzetten"],["erwarten", "verwachten"],["etwas schaffen", "iets klaarspelen"],["nutzen", "gebruiken"],["Streit haben", "ruzie hebben"],["(un)angenehm", "(on)aangenaam"],["wertvoll", "waardevol"]]},
 {id:"l1b", name:"Lijst 1 · B", items:[
  ["der Einschätzungsfehler", "de inschattingsfout", "r"],["der Rollstuhl", "de rolstoel", "r"],["der Zeuge", "de getuige (man)", "r"],["die Behinderung", "de handicap", "r"],["die Betreuung", "de begeleiding", "r"],["die Clique", "de vriendengroep", "r"],["die Doku", "de documentaire", "r"],["die Muskelerkrankung", "de spierziekte", "r"],["die Regelschule", "de reguliere school", "r"],["die Zeugin", "de getuige (vrouw)", "r"],["die Beteiligten", "de betrokken partijen", "r"],["abwärts", "naar beneden", "r"],["alltäglich", "alledaags", "r"],["aufgrund von", "op grond van, naar aanleiding van", "r"],["gelähmt", "verlamd", "r"],["seitdem", "sindsdien", "r"],["der Rücken", "de rug"],["der Stundenplan", "het rooster"],["der Unfall, die Unfälle", "het ongeluk", "", ["der Unfall"]],["die Ausbildung", "de opleiding"],["die Möglichkeit", "de mogelijkheid"],["verbringen", "doorbrengen"],["weiter", "verder"]]},
 {id:"l2a", name:"Lijst 2 · A", items:[
  ["der Deckel", "de deksel", "r"],["der Konsum", "de consumptie", "r"],["der Flieger", "het vliegtuig", "r"],["der Pragmatiker", "iemand die praktisch in het leven staat", "r"],["der Topf", "de pan", "r"],["der Zufall", "het toeval", "r"],["die Empfehlung", "de aanbeveling, het advies", "r"],["die Hauptsache", "de hoofdzaak", "r"],["das Aussehen", "het uiterlijk", "r"],["Einfluss haben auf", "invloed hebben op", "r"],["etwas vermeiden", "iets vermijden", "r"],["im Idealfall", "idealiter", "r"],["inzwischen", "inmiddels", "r"],["stehen zu", "vinden van", "r"],["zumindest", "tenminste", "r"],["die Insel", "het eiland"],["das Rad", "de fiets"],["achten auf", "letten op"],["aussuchen", "uitzoeken"],["ein bisschen", "een beetje"],["hässlich", "lelijk"],["nachhaltig", "duurzaam"],["schön", "mooi"],["wichtig", "belangrijk"],["Das ist mir egal.", "Dat maakt mij niet uit."],["Es gefällt mir (nicht).", "Het bevalt me (niet)."]]},
 {id:"l2b", name:"Lijst 2 · B", items:[
  ["der Alltag", "het dagelijks leven", "r"],["der Mitarbeiter", "de medewerker", "r"],["die Altersgruppe", "de leeftijdsgroep", "r"],["die Aufgabe", "de taak", "r"],["die Kritik", "de kritiek", "r"],["die Wahl", "de verkiezing", "r"],["abstimmen", "stemmen", "r"],["beurteilen", "beoordelen", "r"],["deshalb", "daarom", "r"],["deswegen", "daarom", "r"],["diskutieren", "discussiëren", "r"],["eher", "eerder", "r"],["siegen", "winnen", "r"],["veröffentlichen", "publiceren", "r"],["der Einfluss", "de invloed"],["der Erwachsene, die Erwachsenen", "de volwassene", "", ["der Erwachsene"]],["der Forscher, die Forscher", "de onderzoeker", "", ["der Forscher"]],["der Jugendliche, die Jugendlichen", "de jongere", "", ["der Jugendliche"]],["der Vorschlag, die Vorschläge", "het voorstel", "", ["der Vorschlag"]],["die Stimme", "de stem"],["benutzen", "gebruiken"],["entscheiden", "beslissen"],["seitdem", "sindsdien"],["wählen", "kiezen"]]}
];
/*@@END*/

const WORDS = GROUPS.flatMap(g=>g.items.map(([fr,nl,fl="",alt=[]])=>{
  const f=fl.split(" ");
  return {fr,nl,alt,grp:g.id,zin:!!g.zin,r:f.includes("r"),mv:f.includes("mv"),g:f.includes("m")?"m":f.includes("v")?"v":""};
}));
/* hetzelfde woord in twee lijsten (bv. to assume) krijgt een eigen sleutel */
{const n={};WORDS.forEach(w=>n[w.fr]=(n[w.fr]||0)+1);WORDS.forEach(w=>w.key=n[w.fr]>1?w.grp+"|"+w.fr:w.fr)}

const KEY = LANG.key;
const FIRST_CAT = 3, PER_CAT = 5;   // eerste kat na 3 gekende woordjes, daarna elke 5
const catsFor=m=>m<FIRST_CAT?0:1+Math.floor((m-FIRST_CAT)/PER_CAT);
const ROUND = 10;
const FURS = [["#e8913a","#f6c58a"],["#3b3b44","#f3ede2"],["#9a9aa6","#d7d7de"],["#f3ede2","#e8913a"],["#a8754a","#d9b98c"],["#d9b98c","#f3ede2"],["#5b5b66","#e8913a"]];
const EYES = ["#7ab648","#e9b21c","#4aa3c7","#d98c2b"];

/* Franse stem expliciet kiezen; alleen lang="fr-FR" zetten valt op veel apparaten terug op de Nederlandse standaardstem. */
let FRV=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices().filter(v=>LANG.voice.test(v.lang));
    const score=v=>(LANG.voicePref.test(v.lang)?4:0)+(LANG.voiceNames.test(v.name)?2:0)+(v.localService?1:0);
    FRV=vs.sort((a,b)=>score(b)-score(a))[0]||null;
  }catch(e){FRV=null}
}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t){
  try{
    if(!FRV)pickVoice();
    if(!FRV){if(speechSynthesis.getVoices().length)noVoice();return}
    const u=new SpeechSynthesisUtterance(t.replace(/\.\.\./g,", ").replace(/[()]/g,""));
    u.voice=FRV;u.lang=FRV.lang;u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
function noVoice(){
  if(document.getElementById("nv"))return;
  const p=document.createElement("p");p.id="nv";p.className="note";
  p.textContent=`Er staat geen ${LANG.adj} stem op dit apparaat, dus de uitspraak werkt nog niet. Voeg een ${LANG.adj} stem toe via de spraakinstellingen van het apparaat en laad de pagina opnieuw.`;
  const panel=document.querySelector(".panel");if(panel)panel.appendChild(p);
}

  o.innerHTML=`<div class="modal wide" role="dialog" aria-label="Garderobe van ${esc(c.name)}">
    <div class="row" style="justify-content:space-between"><h2>Garderobe</h2><div class="fish">${FISH}<span>${S.fish}</span></div></div>
    <div class="wardrobe-top">${catSVG(c)}<div class="nmrow"><label for="wn" class="small muted">Naam</label><input type="text" id="wn" value="${esc(c.name)}" maxlength="16"><span class="small muted">Koop iets en het gaat meteen aan. Wat je al hebt, kun je gratis aan- en uittrekken.</span></div></div>
    ${["hoofd","nek","ogen"].map(sl=>`<div class="slot"><h3>${SLOTNAME[sl]}</h3><div class="wgrid">${WEAR.filter(it=>it.slot===sl).map(it=>{
      const own=c.acc.own.includes(it.id), on=c.acc.wear[sl]===it.id;
      const btn=own?`<button data-w="${it.id}" class="${on?"wearing":"plain"}">${on?"Draagt ze":"Aantrekken"}</button>`
                   :`<button data-b="${it.id}" ${S.fish>=it.prijs?"":"disabled"}>${FISH}${it.prijs}</button>`;
      return `<div class="witem ${on?"on":""}">${prev(it)}<div class="nlname">${esc(it.nl)}</div><div class="fr">${esc(it[LANG.code])}</div>${btn}</div>`}).join("")}</div></div>`).join("")}
    <button class="btn" id="wdone">Klaar</button></div>`;
  o.querySelector(".modal").scrollTop=prevScroll;
  const nm=o.querySelector("#wn");
  nm.onchange=()=>{const v=nm.value.trim();if(v){c.name=v;save()}};
  o.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{
    const it=WEAR.find(x=>x.id===b.dataset.b);
    if(!it||S.fish<it.prijs)return;
    S.fish-=it.prijs;c.acc.own.push(it.id);c.acc.col[it.id]=rnd(ACOL);c.acc.wear[it.slot]=it.id;save();wardrobe(i);
  });
  o.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{
    const it=WEAR.find(x=>x.id===b.dataset.w);
    c.acc.wear[it.slot]=c.acc.wear[it.slot]===it.id?null:it.id;save();wardrobe(i);
  });
  o.querySelector("#wdone").onclick=()=>{const v=nm.value.trim();if(v)c.name=v;save();o.remove();home()};
}
function buy(id){
  const it=ITEMS.find(x=>x.id===id);
  if(!it||has(id)||S.fish<it.prijs||!roomOpen(it.room))return;
  S.fish-=it.prijs;S.items.push(id);save();home();
  setTimeout(()=>{const h=document.querySelector(".house");if(h)h.scrollIntoView({behavior:"smooth",block:"start"})},50);
}

/* ---------- huiskamer ---------- */
function home(){
  stopWalk();
  const sel=selected(), m=mastered(), n=WORDS.length, ms=mastered(sel), nc=S.cats.length;
  const boxes=[1,2,3,4,5].map(b=>sel.filter(w=>Math.min(W(w).box,5)===b).length);
  const nextAt=m<FIRST_CAT?FIRST_CAT:FIRST_CAT+catsFor(m)*PER_CAT, prevAt=m<FIRST_CAT?0:nextAt-PER_CAT;
  const need=nextAt-prevAt, toNext=m-prevAt, allDone=m===n, selDone=sel.length&&ms===sel.length;
  const H=houseSVG();
  const nextRoom=nc<ZOLDER_AT?`Bij ${ZOLDER_AT} katten komt de zolder erbij`:nc<TUIN_AT?`Bij ${TUIN_AT} katten komt de tuin erbij`:"Het hele huis en de tuin zijn open";
  $("#app").innerHTML=`
  <div class="top"><h1>${LANG.title}</h1><div class="fish" title="Brokjes">${FISH}<span>${S.fish}</span></div></div>
  <div><div class="house">${H.svg}</div>
    <div class="houseinfo"><span>${nc?"Tik op een kat om haar aan te kleden.":""}</span><span>${nextRoom}</span></div></div>
  <div class="panel">
    <h2>${allDone?"Alles gekend!":"Op weg naar de volgende kat"}</h2>
    ${allDone?`<p>Alle ${n} woordjes${GROUPS.some(g=>g.zin)?" en zinnen":""} zitten in bakje 5. Oefen af en toe om ze vast te houden.</p>`:`<div class="paws" aria-label="${toNext} van ${need}">${Array.from({length:need},(_,i)=>PAW(i<toNext)).join("")}<span class="muted small">nog ${need-toNext} · totaal ${m} van ${n} gekend</span></div>`}
  </div>
  <div class="panel">
    <h2 style="font-size:1.1rem">Wat wil je oefenen?</h2>
    <div class="chips">${GROUPS.map(g=>{const ws=WORDS.filter(w=>w.grp===g.id);return `<button class="chip" aria-pressed="${S.sel.includes(g.id)}" data-g="${g.id}">${esc(g.name)} <span>${mastered(ws)}/${ws.length}</span></button>`}).join("")}</div>
    <div class="bar">${boxes.map((c,i)=>`<div><b>${c}</b>${i<4?"bakje "+(i+1):"gekend"}</div>`).join("")}</div>
    <p class="note" style="margin:10px 0 14px">${LANG.note}</p>
    <div class="row"><button class="btn" id="go" ${sel.length?"":"disabled"}>${selDone?"Herhalen":"Oefenen"}</button><button class="ghost" id="lst">Woordenlijst</button></div>
  </div>
  <div class="panel">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:1.1rem">${LANG.shop}</h2><span class="small muted">Spulletjes voor het huis. Kleren en accessoires: tik op een kat.</span></div>
    ${["w","z","t"].map(r=>{const its=ITEMS.filter(it=>it.room===r), got=its.filter(it=>has(it.id)).length, open=roomOpen(r);
      return `<details class="shopgroup" ${r==="w"?"open":""}><summary>${ROOMNAME[r][0].toUpperCase()+ROOMNAME[r].slice(1)} <span class="small muted">${open?`${got} van ${its.length}`:"nog dicht"}</span></summary>
      <div class="shop">${its.map(it=>{
        const own=has(it.id), can=S.fish>=it.prijs;
        return `<div class="item ${own?"owned":""}"><div class="nlname">${esc(it.nl)}</div><div class="fr">${esc(it[LANG.code])}</div>
          <div class="state">${own?"In huis":!open?`De ${ROOMNAME[r]} is nog dicht`:it.plek||""}</div>
          ${own?"":`<button data-buy="${it.id}" ${open&&can?"":"disabled"}>${FISH}${it.prijs}</button>`}</div>`}).join("")}</div></details>`}).join("")}
  </div>`;
  $("#go").onclick=startRound; $("#lst").onclick=listView;
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    const id=b.dataset.g;
    S.sel=S.sel.includes(id)?S.sel.filter(x=>x!==id):[...S.sel,id];save();home();
  });
  document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy));
  document.querySelectorAll(".mover").forEach(g=>{
    g.addEventListener("click",()=>petCat(g));
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();petCat(g)}});
  });
  startWalk(H.spots);
}

/* ---------- oefenronde ---------- */
let Q=[],qi=0,review=false;
function startRound(){
  const sel=selected(), open=sel.filter(w=>W(w).box<5);
  review=!open.length;
  const pool=review?shuffle(sel):shuffle(open).sort((a,b)=>W(a).box-W(b).box);
  Q=pool.slice(0,Math.min(ROUND,pool.length)).map(w=>({w,retry:false}));
  if(!Q.length)return home();
  qi=0;ask();
}
function modeFor(w){if(w.r)return"fr2nl";if(review)return"type";const b=W(w).box;return b===1?"fr2nl":b===2?"nl2fr":"type"}
const ART=LANG.art;
function normRaw(s){return s.replace(/[’‘`´]/g,"'").replace(/[()?!.,…;:¿¡"«»–]/g," ").replace(/ - /g," ").replace(/\u00a0/g," ")
  .replace(/\s+/g," ").replace(/\b([a-zA-ZäöüÄÖÜ]) ?' ?/g,"$1'").trim()}
function norm(s){return normRaw(s.toLowerCase())}
const caseKey=s=>s?s[0].toLowerCase()+s.slice(1):s;
const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/œ/g,"oe").replace(/ß/g,"ss");
function expand(s){const m=s.match(/^(.*?)\(([^)]*)\)(.*)$/);if(!m)return[s];return[...expand(m[1]+m[3]),...expand(m[1]+m[2]+m[3])]}
const variantsC=w=>[w.fr,...w.alt].flatMap(expand).map(x=>caseKey(normRaw(x)));
const variants=w=>[w.fr,...w.alt].flatMap(expand).map(norm);
const sameNl=w=>WORDS.filter(x=>x.nl===w.nl);
const pool=(w,key)=>WORDS.filter(x=>x!==w&&x.zin===w.zin&&x.nl!==w.nl&&x.fr!==w.fr&&x[key]!==w[key]);

function ask(){
  if(qi>=Q.length)return roundEnd();
  const {w}=Q[qi], mode=modeFor(w);
  const dots=Q.map((_,i)=>`<span class="${i<qi?"done":""}"></span>`).join("");
  const label={fr2nl:"Wat betekent het?",nl2fr:`Kies het ${LANG.adj} woord`,type:`Typ in het ${LANG.name}`}[mode];
  const one=w.zin?" one":"";
  let body="";
  if(mode==="fr2nl"){
    const opts=shuffle([w.nl,...[...new Set(shuffle(pool(w,"nl")).map(x=>x.nl))].slice(0,3)]);
    body=`<div class="prompt${w.zin?" zin":""}">${frLabel(w)} <button class="speak" id="spk" aria-label="Uitspreken">${SPK}</button></div>
      <div class="opts${one}">${opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div>`;
  }else if(mode==="nl2fr"){
    let d=[];
    const m=LANG.code==="fr"&&w.fr.match(/^(le|la) (.*)$/);
    if(m)d.push((m[1]==="le"?"la ":"le ")+m[2]);
    const mde=LANG.code==="de"&&w.fr.match(/^(der|die|das) ([^,]*)$/);
    if(mde)["der","die","das"].filter(x=>x!==mde[1]).forEach(x=>d.push(x+" "+mde[2]));
    d.push(...shuffle(pool(w,"fr")).map(x=>x.fr));
    const opts=shuffle([w.fr,...[...new Set(d)].slice(0,3)]);
    body=`<div class="prompt${w.zin?" zin":""}">${esc(w.nl)}</div>
      <div class="opts${one}">${opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div>`;
  }else{
    const needsArt=!w.zin&&!!ART&&ART.test(w.fr), isVerb=LANG.toVerb&&/^to /.test(w.fr);
    const extra=[w.g==="m"?"mannelijk":w.g==="v"?"vrouwelijk":"",w.mv?"meervoud":""].filter(Boolean).join(", ");
    const plural=/, (der|die|das) /.test(w.fr)?" Het meervoud hoeft niet.":"";
    const hint=LANG.code==="de"?(needsArt?"Met lidwoord, en het zelfstandig naamwoord met een hoofdletter."+plural:"Let op de spelling en de umlauts."):LANG.code!=="fr"?(isVerb?"Let op de spelling, en begin met <b>to</b>.":"Let op de spelling."):w.zin?"Let op de accenten. Leestekens en hoofdletters mag je overslaan.":needsArt?"Vergeet het lidwoord niet!":"Let op de accenten.";
    body=`<div class="prompt${w.zin?" zin":""}">${esc(w.nl)}</div>
      <p class="hint">${hint}${extra?` (${extra})`:""}</p>
      <form id="tf" autocomplete="off"><input type="text" id="inp" autocapitalize="${LANG.caseSensitive?"sentences":"off"}" spellcheck="false" aria-label="Jouw antwoord" placeholder="${needsArt?(LANG.code==="de"?"der / die / das …":"le / la / l' / les …"):isVerb?"to …":""}">
      ${LANG.keys.length?`<div class="keys">${LANG.keys.map(k=>`<button type="button" class="key">${k}</button>`).join("")}</div>`:""}
      <button class="btn" type="submit">Controleer</button></form>`;
  }
  $("#app").innerHTML=`<div class="qhead"><button class="ghost" id="stop">Stoppen</button><div class="dots">${dots}</div><div class="fish">${FISH}<span>${S.fish}</span></div></div>
  <div class="panel"><div class="mode">${review?"Herhaling · ":""}${w.r?"Herkennen · ":""}${label}</div>${body}<div id="fb"></div></div>`;
  $("#stop").onclick=home;
  if($("#spk")){$("#spk").onclick=()=>speak(w.fr);speak(w.fr)}
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const want=mode==="fr2nl"?w.nl:w.fr, ok=b.textContent===want;
    document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===want)x.classList.add("good")});
    if(!ok)b.classList.add("bad");
    result(w,ok,ok?null:{type:"pick"});
  });
  if($("#tf")){
    const inp=$("#inp");inp.focus();
    document.querySelectorAll(".key").forEach(k=>k.addEventListener("pointerdown",e=>e.preventDefault()));
    document.querySelectorAll(".key").forEach(k=>k.onclick=()=>{const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+k.textContent+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+1,p+1)});
    $("#tf").onsubmit=e=>{e.preventDefault();if(!inp.value.trim())return;inp.disabled=true;
      document.querySelectorAll(".key,#tf .btn").forEach(x=>x.disabled=true);check(w,inp.value)};
  }
}
function check(w,raw){
  const a=norm(raw);
  const hit=sameNl(w).find(x=>variants(x).includes(a));
  if(hit&&LANG.caseSensitive&&!variantsC(hit).includes(caseKey(normRaw(raw))))return result(w,false,{type:"hoofdletter",typed:raw.trim()});
  if(hit)return result(w,true,hit!==w?{also:w.fr,typedWord:hit.fr}:null);
  if(LANG.toVerb&&!/^to /.test(a)){const hit2=sameNl(w).find(x=>variants(x).includes("to "+a));if(hit2)return LANG.toRequired?result(w,false,{type:"geento",typed:raw.trim()}):result(w,true,{noTo:hit2.fr})}
  const cands=variants(w);
  const acc=cands.find(e=>strip(e)===strip(a));
  if(acc)return result(w,false,{type:"accent",typed:raw.trim(),e:acc});
  if(!w.zin&&ART){
    const aa=(a.match(ART)||[""])[0], ar=a.slice(aa.length);
    for(const e of cands){
      const ea=(e.match(ART)||[""])[0], er=e.slice(ea.length);
      if(!ea)continue;
      if(!aa&&strip(ar)===strip(er))return result(w,false,{type:"geenlw",typed:raw.trim()});
      if(aa&&aa!==ea&&strip(ar)===strip(er))return result(w,false,{type:"lw",typed:raw.trim()});
    }
  }
  result(w,false,{type:"spel",typed:raw.trim()});
}
function markAccents(e,typed){
  const t=norm(typed);
  if(t.length!==e.length)return esc(e);
  return [...e].map((ch,i)=>ch!==t[i]?`<mark>${esc(ch)}</mark>`:esc(ch)).join("");
}
function result(w,ok,info){
  const st=W(w), before=st.box;
  let msg="";
  if(ok){
    S.fish++;
    st.box=Math.min(5,st.box+1);
    if(before<5&&st.box===5&&st.wrong>=3)S.rarePending++;
    const also=info&&info.also?`<div class="small">Jij typte <b>${esc(info.typedWord)}</b>, ook goed. In de lijst staat hier ook <b>${esc(info.also)}</b> bij.</div>`:"";
    const noTo=info&&info.noTo?`<div class="small">Goed! In de lijst staat het met <b>to</b> ervoor: <b>${esc(info.noTo)}</b>.</div>`:"";
    msg=`<div class="fb ok"><div class="big">${rnd(LANG.praise)}</div><div>+1 brokje${st.box===5&&before<5?" · dit is nu <b>gekend</b>!":""}</div>${also}${noTo}</div>`;
  }else{
    st.wrong++;
    if(!review||st.box<5)st.box=Math.max(1,st.box-2); else st.box=w.r?2:3;
    const why={hoofdletter:"Bijna! Let op de hoofdletters.",geento:"Bijna! Je bent <b>to</b> vergeten.",geenlw:"Je bent het lidwoord vergeten.",lw:"Bijna! Het lidwoord klopt niet.",accent:LANG.code==="de"?"Bijna! Let op de umlauts (ä, ö, ü) en de ß.":"Bijna! Kijk goed naar de accenten.",spel:"Nog niet goed.",pick:"Helaas, dat was het niet."}[info.type];
    msg=`<div class="fb no"><div class="big">${why}</div>
      <div>Goed is: <span class="answer">${esc(w.fr)}</span> = ${esc(w.nl)}</div>
      ${info.type==="accent"?`<div class="small">Hier zat het: <span class="answer" style="font-size:1.15rem">${markAccents(info.e,info.typed)}</span></div>`:""}
      ${info.typed?`<div class="small muted">Jij typte: ${esc(info.typed)}</div>`:""}
      <div class="small muted">Dit komt straks nog een keer terug.</div></div>`;
    if(!Q[qi].retry){Q.splice(Math.min(qi+3,Q.length),0,{w,retry:true})}
  }
  save();
  $("#fb").innerHTML=msg+`<div class="row" style="margin-top:12px;justify-content:space-between"><button class="speak" id="spk2" aria-label="Uitspreken">${SPK}</button><button class="btn" id="next">Verder</button></div>`;
  $(".qhead .fish span").textContent=S.fish;
  $("#spk2").onclick=()=>speak(w.fr);
  $("#next").focus({preventScroll:true});
  try{$("#fb").scrollIntoView({behavior:"smooth",block:"nearest"})}catch(e){}
  $("#next").onclick=()=>{qi++;if(!adoptCheck(ask))ask()};
}
function adoptCheck(then){
  const due=catsFor(mastered())+S.rarePending;
  if(S.cats.length<due){
    const rare=S.rarePending>0&&S.cats.filter(c=>c.rare).length<S.rarePending;
    const c=newCat(rare);S.cats.push(c);save();adoptModal(c,then);return true;
  }
  if(!S.party&&mastered()===WORDS.length){S.party=true;save();partyModal(then);return true}
  return false;
}
function adoptModal(c,then){
  const o=document.createElement("div");o.className="overlay";
  o.innerHTML=`<div class="modal" role="dialog" aria-label="Nieuwe kat">
    <h2>${c.rare?"Een zeldzame gouden kat!":"Er komt een kat bij je wonen!"}</h2>
    ${catSVG(c,"bigcat")}
    <p class="small muted">${c.rare?"Omdat je een lastig woordje toch onder de knie kreeg.":(S.cats.filter(x=>!x.rare).length===1?`Je kent je eerste ${FIRST_CAT} woordjes helemaal.`:`Je kent weer ${PER_CAT} woordjes helemaal.`)}</p>
    <label for="cn" class="small">Hoe heet ze?</label>
    <input type="text" id="cn" value="${esc(c.name)}" maxlength="16">
    <button class="btn" id="ok">Welkom thuis!</button></div>`;
  document.body.appendChild(o);
  o.querySelector("#ok").onclick=()=>{const v=o.querySelector("#cn").value.trim();if(v)c.name=v;save();o.remove();then()};
}
function partyModal(then){
  const o=document.createElement("div");o.className="overlay";
  o.innerHTML=`<div class="modal"><h2>${LANG.party}</h2>
    <div class="row" style="justify-content:center">${S.cats.slice(0,6).map(c=>catSVG(c)).join("").replace(/<svg /g,'<svg style="width:64px;height:64px" ')}</div>
    <p>Je kent álle ${WORDS.length} woordjes${GROUPS.some(g=>g.zin)?" en zinnen":""}, ${LANG.allText}. Alle katten vieren feest!</p>
    <button class="btn" id="ok">Miauw!</button></div>`;
  document.body.appendChild(o);o.querySelector("#ok").onclick=()=>{o.remove();then()};
}
function roundEnd(){
  if(adoptCheck(roundEnd))return;
  const sel=selected();
  $("#app").innerHTML=`<div class="panel" style="text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center">
    <h2>Ronde klaar!</h2><p>Van wat je nu oefent ken je er <b>${mastered(sel)}</b> van de ${sel.length}. Je hebt <b>${S.fish}</b> brokjes voor je katten.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Nog een ronde</button><button class="ghost" id="h">Naar het kattenhuis</button></div></div>`;
  $("#again").onclick=startRound;$("#h").onclick=home;
}

/* ---------- lijst ---------- */
function listView(){
  $("#app").innerHTML=`<div class="top"><h1>Woordenlijst</h1><button class="ghost" id="back">Terug</button></div>
  ${GROUPS.map(g=>`<div class="panel tablewrap"><h2 style="font-size:1.1rem">${esc(g.name)}</h2><table><thead><tr><th>${LANG.name}</th><th>Nederlands</th><th>Bakje</th><th>Fout</th></tr></thead><tbody>
  ${WORDS.filter(w=>w.grp===g.id).map(w=>{const s=W(w);return `<tr><td>${frLabel(w)}${w.r?' <span class="tag">herkennen</span>':""}</td><td>${esc(w.nl)}</td><td class="lvl">${s.box>=5?"gekend":s.box}</td><td class="lvl">${s.wrong}</td></tr>`}).join("")}</tbody></table></div>`).join("")}
  <div class="panel"><h2 style="font-size:1.05rem">Opnieuw beginnen</h2><p class="small muted">Zet alle woordjes terug naar bakje 1. De katten en brokjes blijven.</p>
  <div class="row" id="rz"><button class="ghost" id="reset">Woordjes resetten</button></div></div>`;
  $("#back").onclick=home;
  $("#reset").onclick=()=>{$("#rz").innerHTML=`<span class="small">Zeker weten?</span><button class="ghost" id="yes">Ja, resetten</button><button class="ghost" id="no">Nee</button>`;
    $("#yes").onclick=()=>{S.words={};S.party=false;save();listView()};$("#no").onclick=listView};
}
home();
</script>
</body>
</html>
