<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rennmaus-Revier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
.back{display:inline-block;font:inherit;font-size:.9rem;color:var(--muted);text-decoration:none;padding:4px 0}
.back:hover,.back:focus-visible{color:var(--ink);text-decoration:underline}
.backbar{max-width:660px;margin:0 auto;padding-top:10px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
/* Layout: één kolom; bovenaan het gerbilterrarium in doorsnede (gangen in het zand), daaronder voortgang, onderwerpen en de winkel. Oefenen vervangt het scherm. */
:root{
  --bg:#e9f0f3;       /* lucht boven de steppe */
  --card:#fbfdfd;
  --ink:#22313a;
  --muted:#5b6c75;
  --line:#d1dce1;
  --accent:#d9822b;   /* gerbilvacht (agouti) */
  --accent-ink:#22313a;
  --leaf:#3f8f5a;
  --bad:#c2453b;
  --sand:#ead2a0;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#162026;--card:#1f2c33;--ink:#eef4f6;--muted:#a7b8c0;--line:#34454f;--accent:#f0a04f;--accent-ink:#162026;--leaf:#6cc488;--bad:#ef7a6f;--sand:#5c4a2c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#162026;--card:#1f2c33;--ink:#eef4f6;--muted:#a7b8c0;--line:#34454f;--accent:#f0a04f;--accent-ink:#162026;--leaf:#6cc488;--bad:#ef7a6f;--sand:#5c4a2c;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:660px;margin:0 auto;padding-block:16px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:16px}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem}
h2{font-size:1.3rem}
h3{font-size:1.2rem;margin-bottom:6px}
h4{font-size:1.02rem;margin:12px 0 4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seeds{display:flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;flex:none}
.seeds svg{width:18px;height:22px}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.tank{border-radius:16px;overflow:hidden;line-height:0;background:#cfe3ea}
.tank svg{width:100%;height:auto;display:block}
.tankinfo{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.86rem;color:var(--muted);margin-top:6px}
.gb{cursor:pointer;outline:none;transition:transform 2.4s ease-in-out}
.gb:focus-visible .gbody{stroke:#d9822b;stroke-width:4}
.gtail{transform-box:fill-box;transform-origin:100% 0%;animation:tail 1.8s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
.geye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.hop{animation:hop .5s ease-out 2}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}}
.spin{transform-box:view-box;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.svgheart{animation:svgfloat 1.4s ease-out forwards;pointer-events:none}
@keyframes svgfloat{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}
.glow{animation:glow 2.6s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.45}to{opacity:.85}}

.paws{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seedpip{width:22px;height:28px}
.seedpip path{fill:var(--line)}
.seedpip.on path{fill:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;font-size:.92rem;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] span{color:var(--accent-ink)}
.btn{font:inherit;font-family:var(--display);font-weight:800;font-size:1.15rem;border:0;border-radius:14px;padding:10px 20px;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%, #000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%, #000)}
.btn:disabled{opacity:.5;cursor:default}
.ghost{font:inherit;background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer}
.btn:focus-visible,.ghost:focus-visible,.chip:focus-visible,.opt:focus-visible,.key:focus-visible,input:focus-visible,.item button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* oefenen */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.dots span{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots span.done{background:var(--accent)}
.mode{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.ins{margin:4px 0 12px;font-weight:700}
.sent{font-size:1.18rem;line-height:2.2}
.bw{white-space:nowrap}
.stem{font-weight:700}
.fb a{color:inherit;font-weight:700}
input.blank:focus-visible{outline:2.5px solid var(--accent);outline-offset:1px}
input.blank{font:inherit;font-size:1.05rem;border:0;border-bottom:2.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%, var(--card));color:var(--ink);border-radius:6px 6px 0 0;padding:0 4px;margin:0 2px;max-width:100%}
input.blank.ok{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 16%, var(--card))}
input.blank.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%, var(--card));text-decoration:line-through}
.nl{font-style:italic;color:var(--muted);font-size:.92rem;margin-top:8px}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 12px}
.key{font:inherit;font-size:1.1rem;min-width:42px;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.q{font-family:var(--display);font-size:2.1rem;text-align:center;padding:12px 0 14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.opts{grid-template-columns:1fr}}
.opt{font:inherit;font-size:1.02rem;padding:12px 10px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.good{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 20%, var(--bg))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%, var(--bg))}
.fb{border-radius:14px;padding:12px 14px;margin-top:14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:color-mix(in srgb,var(--leaf) 16%, var(--card))}
.fb.no{background:color-mix(in srgb,var(--bad) 11%, var(--card))}
.fb .big{font-family:var(--display);font-weight:800;font-size:1.25rem}
.fb ul{margin:0;padding-left:20px}
.fb li{margin:2px 0}
.ans{font-weight:700}
.tag{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:0 8px;background:color-mix(in srgb,var(--bad) 18%, transparent);color:var(--ink);margin-left:4px}

/* uitleg */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.uitleg p,.uitleg li{max-width:65ch}
.uitleg ul,.uitleg ol{padding-left:22px;margin:4px 0}
.tw{overflow-x:auto;margin:8px 0}
table.gt{border-collapse:collapse;font-size:.95rem;min-width:100%}
table.gt th,table.gt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.gt thead th{background:color-mix(in srgb,var(--accent) 22%, var(--card));font-family:var(--display)}
table.gt tbody th{background:color-mix(in srgb,var(--line) 45%, var(--card));white-space:nowrap}
table.gt small{font-weight:400;color:var(--muted)}

/* winkel */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.item{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;background:var(--bg)}
.item .de{font-style:italic;color:var(--muted);font-size:.85rem;line-height:1.2}
.item .nm{font-weight:700;line-height:1.2}
.item .state{font-size:.82rem;color:var(--muted)}
.item button{font:inherit;font-size:.92rem;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:10px;padding:6px 8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:700}
.item button svg{width:14px;height:18px}
.item button svg path{fill:currentColor}
.item button:disabled{background:var(--line);color:var(--muted);cursor:default}
.item.owned{border-color:var(--leaf)}
.item.owned .state{color:var(--leaf);font-weight:700}

/* vensters */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#0d1418 55%, transparent);display:grid;place-items:center;z-index:20;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.modal{background:var(--card);border-radius:22px;padding:20px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.modal svg.big{width:200px;height:auto;overflow:visible;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.modal input{font:inherit;font-size:1.15rem;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
@media (max-width:480px){
  body{font-size:16px}
  .wrap{padding-block:10px 32px;gap:14px}
  h1{font-size:1.6rem}
  .panel{padding:14px;border-radius:16px}
  .sent{font-size:1.06rem;line-height:2.15}
  .q{font-size:1.8rem;padding:6px 0 10px}
  .keys{gap:5px;margin:10px 0}
  .key{min-width:0;flex:1 0 calc(14% - 5px);padding:8px 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="backbar"><a class="back" href="../index.html">← Alle spellen</a></div>
<div class="wrap" id="app"></div>

<script>
/* ===== ONDERWERPEN EN OPGAVEN =====
   Invulzinnen: [[antwoord|waarom|hint]]. Het antwoord is de uitgang die na de letters vóór [[ komt
   (d[[em]] → dem). Meerdere goede antwoorden: muss/soll. Een lege uitgang ([[|…]]) betekent: het woord blijft zoals het is. */
const TOPICS = [
 {id:"hsw",   name:"haben, sein, werden"},
 {id:"stark", name:"Sterke werkwoorden"},
 {id:"modal", name:"Modale werkwoorden"},
 {id:"lidw",  name:"Lidwoorden & naamvallen"},
 {id:"vz",    name:"Voorzetsels"},
 {id:"mv",    name:"Meervoud"},
];

const RAW = [];
const B=(t,ins,txt,nl,extra)=>RAW.push({t,kind:"blank",ins,txt,nl,...(extra||{})});
const MC=(t,ins,q,opts,a,why,nl)=>RAW.push({t,kind:"mc",ins,q,opts,a,why,nl});

/* ---------- haben, sein, werden ---------- */
const HSW_INS="Vul de goede vorm van haben, sein of werden in (tegenwoordige tijd).";
B("hsw","Vervoeg haben in de tegenwoordige tijd.","<b>haben</b>: ich [[habe]] · du [[hast]] · er/sie/es [[hat]] · wir [[haben]] · ihr [[habt]] · sie/Sie [[haben]]");
B("hsw","Vervoeg sein in de tegenwoordige tijd.","<b>sein</b>: ich [[bin]] · du [[bist]] · er/sie/es [[ist]] · wir [[sind]] · ihr [[seid]] · sie/Sie [[sind]]");
B("hsw","Vervoeg werden in de tegenwoordige tijd.","<b>werden</b>: ich [[werde]] · du [[wirst]] · er/sie/es [[wird]] · wir [[werden]] · ihr [[werdet]] · sie/Sie [[werden]]");
B("hsw",HSW_INS,"Hallo Paul, ich [[habe|ich → habe|heb]] lange nichts mehr von dir gehört. Seit wir zusammen Urlaub in Spanien gemacht [[haben|wir → haben|hebben]].","Hallo Paul, ik heb lang niets meer van je gehoord. Sinds we samen op vakantie in Spanje zijn geweest.");
B("hsw",HSW_INS,"Es [[ist|es → ist|is]] toll, einen so guten Freund wie dich zu haben. [[Wirst|du → wirst (werden = zullen)|zal]] du mir schreiben, was du seitdem erlebt [[hast|du → hast|hebt]]?","Het is geweldig om zo'n goede vriend als jij te hebben. Zul je me schrijven wat je sindsdien hebt meegemaakt?");
B("hsw",HSW_INS,"Ich [[bin|ich → bin|ben]] sehr neugierig darauf. [[Hat|deine Schule = er/sie/es → hat|Heeft]] deine Schule wieder normal angefangen oder [[habt|ihr → habt|hebben]] ihr seit Schulbeginn nur Online-Unterricht?","Ik ben erg benieuwd. Is je school weer normaal begonnen of hebben jullie sinds het begin van het schooljaar alleen online les?");
B("hsw",HSW_INS,"Meine Schule [[hat|meine Schule = sie → hat|heeft]] alle beide Unterrichtsformen eingeführt. Die Lehrer [[sind|die Lehrer = sie (mv) → sind|zijn]] schon ganz gut im Online-Unterrichten. [[Bist|du → bist|Ben]] du damit in deiner Schule zufrieden?","Mijn school heeft allebei de lesvormen ingevoerd. De leraren zijn al heel goed in online lesgeven. Ben jij daar op jouw school tevreden mee?");
B("hsw",HSW_INS,"Bald [[sind|die Weihnachtsferien = sie (mv) → sind|zijn]] die Weihnachtsferien. Was [[hast|du → hast|heb]] du vor? Ich [[habe|ich → habe|heb]] Lust, mich mit dir zu treffen. Dann [[werden|wir → werden (zullen)|zullen]] wir neue Pläne für die Sommerferien machen.","Binnenkort is het kerstvakantie. Wat ben je van plan? Ik heb zin om met je af te spreken. Dan zullen we nieuwe plannen voor de zomervakantie maken.");
B("hsw",HSW_INS,"[[Hast|du → hast|Heb]] du eigentlich schon den neuen Film von Leonardo DiCaprio gesehen? Er [[wird|er → wird|wordt]] sehr gut im Internet besprochen. Lass schnell von dir hören! Dein Stefan","Heb je eigenlijk de nieuwe film van Leonardo DiCaprio al gezien? Hij wordt heel goed besproken op internet. Laat snel van je horen! Je Stefan");

/* ---------- sterke werkwoorden ---------- */
const STARK=[
 // [infinitief, vertaling, du, er, gebiedende wijs of "", waarom]
 ["schlafen","slapen","schläfst","schläft","","a → ä bij du en er/sie/es"],
 ["halten","houden","hältst","hält","","a → ä; stam op -t: du hältst, er hält (geen extra -t)"],
 ["fallen","vallen","fällst","fällt","","a → ä"],
 ["lassen","laten","lässt","lässt","","a → ä; stam op -ss: du lässt"],
 ["stoßen","stoten","stößt","stößt","","o → ö; stam op -ß: du stößt"],
 ["laufen","lopen","läufst","läuft","","au → äu"],
 ["saufen","zuipen","säufst","säuft","","au → äu"],
 ["fahren","rijden, varen","fährst","fährt","","a → ä"],
 ["tragen","dragen","trägst","trägt","","a → ä"],
 ["fangen","vangen","fängst","fängt","","a → ä"],
 ["laden","laden","lädst","lädt","","a → ä; er lädt"],
 ["brechen","breken","brichst","bricht","brich","e → i (na de e staan 2 medeklinkers)"],
 ["helfen","helpen","hilfst","hilft","hilf","e → i (na de e staan 2 medeklinkers)"],
 ["gelten","gelden","giltst","gilt","","e → i; stam op -t: du giltst, er gilt"],
 ["essen","eten","isst","isst","iss","e → i (2 medeklinkers); du isst"],
 ["lesen","lezen","liest","liest","lies","e → ie (na de e staat 1 medeklinker); du liest"],
 ["sehen","zien","siehst","sieht","sieh","e → ie (1 medeklinker)"],
 ["geben","geven","gibst","gibt","gib","uitzondering: lange e, toch e → i"],
 ["nehmen","nemen","nimmst","nimmt","nimm","uitzondering: e → i, en de m wordt mm"],
 ["treten","trappen","trittst","tritt","tritt","uitzondering: e → i, en de t wordt tt"],
 ["gehen","gaan","gehst","geht","","geen klinkerwisseling: gehen is gewoon regelmatig in de o.t.t."],
 ["stehen","staan","stehst","steht","","geen klinkerwisseling: regelmatig in de o.t.t."],
 ["bewegen","bewegen","bewegst","bewegt","","geen klinkerwisseling: bewegen is een zwak werkwoord"],
];
STARK.forEach(([inf,nl,du,er,imp,why])=>{
  B("stark","Vul de du- en er/sie/es-vorm in"+(imp?", en de gebiedende wijs (enkelvoud).":"."),
    `<b>${inf}</b> <span class="muted">(${nl})</span><br>du [[${du}|${why}]] · er/sie/es [[${er}|${why}]]`+(imp?` · gebiedende wijs: [[${imp}|gebiedende wijs enkelvoud: ook e → ${imp.includes("ie")?"ie":"i"}]]!`:""));
});
STARK.forEach(([inf,nl])=>{
  const others=STARK.filter(x=>x[0]!==inf&&x[1]!==nl).map(x=>x[1]);
  MC("stark","Wat betekent dit werkwoord?",inf,null,nl,"",null);
});

/* ---------- modale werkwoorden ---------- */
[["können","kunnen"],["mögen","mogen, lusten, graag hebben"],["dürfen","mogen (toestemming hebben)"],["müssen","moeten"],
 ["sollen","moeten (opdracht of advies), zullen"],["wollen","willen"],["wissen","weten"],["möchten","zou(den) graag willen"]]
 .forEach(([de,nl])=>MC("modal","Wat betekent dit werkwoord?",de,null,nl,"",null));
[["können","kann","kannst","kann","können","könnt","können"],
 ["mögen","mag","magst","mag","mögen","mögt","mögen"],
 ["dürfen","darf","darfst","darf","dürfen","dürft","dürfen"],
 ["müssen","muss","musst","muss","müssen","müsst","müssen"],
 ["sollen","soll","sollst","soll","sollen","sollt","sollen"],
 ["wollen","will","willst","will","wollen","wollt","wollen"],
 ["wissen","weiß","weißt","weiß","wissen","wisst","wissen"],
 ["möchten","möchte","möchtest","möchte","möchten","möchtet","möchten"]]
 .forEach(([v,a,b,c,d,e,f])=>B("modal","Vervoeg het werkwoord in de tegenwoordige tijd.",
   `<b>${v}</b>: ich [[${a}]] · du [[${b}]] · er/sie/es [[${c}]] · wir [[${d}]] · ihr [[${e}]] · sie/Sie [[${f}]]`));
B("modal","Vul de goede vorm in. Kies uit: können, mögen, dürfen, müssen, sollen, wollen, wissen, möchten.",
 "Stefanie ist 16. Sobald sie 17 Jahre alt ist, [[möchte|zou willen = möchten; sie → möchte|zou willen]] sie ihren Führerschein machen. „Ich habe die Dinge noch nie gemocht. [[Weißt|weten = wissen; du → weißt|weten]] du, wie sie stinken?“",
 "Stefanie is 16. Zodra ze 17 is, wil ze haar rijbewijs halen. 'Ik heb die dingen nooit leuk gevonden. Weet je hoe ze stinken?'");
B("modal","Vul de goede vorm in. Kies uit: können, mögen, dürfen, müssen, sollen, wollen, wissen, möchten.",
 "Jugendliche in Deutschland [[dürfen|mogen (toestemming) = dürfen; Jugendliche = sie → dürfen|mogen]] seit 2008 schon mit 17 Jahren Fahrstunden nehmen. Aber auch nach bestandener Prüfung [[muss|moeten = müssen; ein Erwachsener = er → muss|moeten]] immer ein Erwachsener neben dem jungen Fahrer im Auto dabei sein.",
 "Jongeren in Duitsland mogen sinds 2008 al met 17 jaar rijles nemen. Maar ook na het examen moet er altijd een volwassene naast de jonge bestuurder in de auto zitten.");
const MS="Kies tussen müssen en sollen, en vul de goede vorm in.";
B("modal",MS,"Wie spät [[müssen|het is nodig om de vlucht te halen → müssen; Sie → müssen]] Sie am Flughafen sein, um den Flug nicht zu verpassen?","Hoe laat moet u op het vliegveld zijn om de vlucht niet te missen?");
B("modal",MS,"Wenn man nach Asien reist, [[soll/muss|allebei goed: soll = het wordt aangeraden, muss = het is verplicht; man → soll / muss]] man gegen Hepatitis geimpft sein.","Als je naar Azië reist, moet je tegen hepatitis ingeënt zijn.");
B("modal",MS,"Man [[soll|de politie geeft een advies → sollen; man → soll]] beim Radfahren keine Musik hören, rät die Polizei.","Je moet tijdens het fietsen geen muziek luisteren, adviseert de politie.");
B("modal",MS,"Wir [[müssen|het is echt nodig, anders stopt de auto → müssen; wir → müssen]] echt schnell tanken, sonst stoppt das Auto mitten auf der Straße.","We moeten echt snel tanken, anders stopt de auto midden op straat.");

hsw:`<h3>haben, sein en werden</h3>
<div class="tw"><table class="gt"><thead><tr><th></th><th>haben<br><small>hebben</small></th><th>sein<br><small>zijn</small></th><th>werden<br><small>worden, zullen</small></th></tr></thead><tbody>

<tr><th>er/sie/es</th><td>hat</td><td>ist</td><td>wird</td></tr><tr><th>wir</th><td>haben</td><td>sind</td><td>werden</td></tr>
<tr><th>ihr</th><td>habt</td><td>seid</td><td>werdet</td></tr><tr><th>sie/Sie</th><td>haben</td><td>sind</td><td>werden</td></tr></tbody></table></div>
<p>Zoek eerst het onderwerp: <i>die Lehrer</i> = sie (meervoud) → <b>sind</b>. <i>Meine Schule</i> = sie (enkelvoud) → <b>hat</b>.</p>
<p><b>werden</b> gebruik je ook voor de toekomst: <i>Wir werden neue Pläne machen</i> = we zullen nieuwe plannen maken.</p>`,
stark:`<h3>Sterke werkwoorden in de tegenwoordige tijd</h3>
<p>De uitgangen zijn gewoon: ich stam+<b>e</b>, du stam+<b>st</b>, er/sie/es stam+<b>t</b>, wir stam+<b>en</b>, ihr stam+<b>t</b>, sie/Sie stam+<b>en</b>. Alleen bij <b>du</b> en <b>er/sie/es</b> verandert bij sterke werkwoorden de klinker.</p>
<h4>a, au, o → ä, äu, ö</h4>
<p>fahren → du f<b>ä</b>hrst, er f<b>ä</b>hrt · laufen → du l<b>äu</b>fst, er l<b>äu</b>ft · stoßen → du st<b>ö</b>ßt, er st<b>ö</b>ßt</p>
<h4>e → i of ie (e/i-Wechsel)</h4>
<p>Ook in de gebiedende wijs (enkelvoud).</p>
<ul><li><b>1 medeklinker</b> na de eerste e → <b>ie</b>: lesen → du liest, er liest, lies!</li>
<li><b>2 of meer medeklinkers</b> na de eerste e → <b>i</b>: helfen → du hilfst, er hilft, hilf!</li>
<li>Uitzonderingen met toch <b>i</b>: geben → gibst, gibt, gib! · nehmen → nimmst, nimmt, nimm! · treten → trittst, tritt, tritt!</li></ul>
<h4>Stam op -d of -t</h4>
<p>Bij du komt <b>-st</b> (niet -est): halten → du hältst, gelten → du giltst. Bij er/sie/es komt er geen extra -t: er hält, er gilt, er lädt.</p>
<p>Let op: <b>gehen, stehen</b> en <b>bewegen</b> zijn in de tegenwoordige tijd gewoon regelmatig: du gehst, er steht.</p>`,

<div class="tw"><table class="gt"><thead><tr><th></th><th>können</th><th>mögen</th><th>dürfen</th><th>müssen</th></tr></thead><tbody>
<tr><th>ich</th><td>kann</td><td>mag</td><td>darf</td><td>muss</td></tr><tr><th>du</th><td>kannst</td><td>magst</td><td>darfst</td><td>musst</td></tr>

<tr><th>ihr</th><td>könnt</td><td>mögt</td><td>dürft</td><td>müsst</td></tr><tr><th>sie/Sie</th><td>können</td><td>mögen</td><td>dürfen</td><td>müssen</td></tr></tbody></table></div>
<div class="tw"><table class="gt"><thead><tr><th></th><th>sollen</th><th>wollen</th><th>wissen</th><th>möchten</th></tr></thead><tbody>
<tr><th>ich</th><td>soll</td><td>will</td><td>weiß</td><td>möchte</td></tr><tr><th>du</th><td>sollst</td><td>willst</td><td>weißt</td><td>möchtest</td></tr>
<tr><th>er/sie/es</th><td>soll</td><td>will</td><td>weiß</td><td>möchte</td></tr><tr><th>wir</th><td>sollen</td><td>wollen</td><td>wissen</td><td>möchten</td></tr>
<tr><th>ihr</th><td>sollt</td><td>wollt</td><td>wisst</td><td>möchtet</td></tr><tr><th>sie/Sie</th><td>sollen</td><td>wollen</td><td>wissen</td><td>möchten</td></tr></tbody></table></div>

  <rect x="0" y="320" width="400" height="10" fill="#8a6a4a"/>`;
  if(has("lampe")) s+=`<path d="M300 6 h40 l-6 -6 h-28z" fill="#c2453b"/><rect x="312" y="0" width="16" height="6" fill="#8a2f28"/>`;
  if(has("schild")&&S.gerbils.length){const t=S.gerbils.slice(0,4).map(g=>g.name).join(" · ")+(S.gerbils.length>4?" …":"");
    s+=`<rect x="16" y="298" width="${Math.min(220,30+t.length*6.2)}" height="17" rx="4" fill="#fff8ec" stroke="#a8754a" stroke-width="1.5"/><text x="24" y="310.5" font-size="10.5" font-family="Baloo 2, sans-serif" font-weight="800" fill="#4a2f1d">${esc(t)}</text>`}
  return {svg:s,chambers};
}
/* plekken waar gerbils kunnen zitten */
function spotsList(chambers){
  const sp=[];
  chambers.forEach(c=>sp.push({x:c.x,y:c.y+9,s:.34,u:1}));
  if(has("laufrad")) sp.push({x:60,y:114,s:.32,run:1});
  if(has("haus")) sp.push({x:332,y:77,s:.36});
  if(has("etage")) sp.push({x:200,y:62,s:.36});
  if(has("bruecke")) sp.push({x:136,y:96,s:.34});
  if(has("sand")) sp.push({x:186,y:121,s:.34});
  if(has("haenge")) sp.push({x:200,y:104,s:.32});
  [96,160,214,262,300,350,40].forEach(x=>sp.push({x,y:124,s:.38}));
  return sp;
}
let gpos=[],walkT=null;
function stopWalk(){if(walkT){clearInterval(walkT);walkT=null}}
const place=p=>`translate(${p.x}px,${p.y}px) scale(${p.f?-p.s:p.s},${p.s}) translate(-50px,-58px)`;
function houseHTML(){
  const T=tankSVG(), sp=spotsList(T.chambers);
  const order=[];const u=sp.filter(p=>p.u),o=sp.filter(p=>!p.u);
  for(let i=0;order.length<sp.length;i++){if(o[i])order.push(o[i]);if(u[i])order.push(u[i])}
  gpos=S.gerbils.map((g,i)=>({...order[i%order.length],f:i%3===1}));
  const gs=S.gerbils.map((g,i)=>`<g class="gb" data-i="${i}" tabindex="0" role="button" aria-label="${esc(g.name)}" style="transform:${place(gpos[i])}"><g class="hopg">${gerbilInner(g,i*1.3)}</g></g>`).join("");
  return {spots:order,svg:`<svg viewBox="0 0 400 330" role="img" aria-label="Het gerbilterrarium met ${S.gerbils.length} gerbil${S.gerbils.length===1?"":"s"}">${T.svg}<g id="glayer">${gs}</g>
  ${S.gerbils.length?"":`<rect x="92" y="150" width="216" height="46" rx="12" fill="#fff8ec" opacity=".94"/><text x="200" y="169" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="14" fill="#22313a">Het terrarium is nog leeg.</text><text x="200" y="186" text-anchor="middle" font-size="11" fill="#22313a">Ken ${FIRST} opgaven en je eerste gerbil komt!</text>`}</svg>`};
}
function startWalk(spots){
  stopWalk();
  if(S.gerbils.length<1)return;
  try{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return}catch(e){}
  walkT=setInterval(()=>{
    const layer=document.getElementById("glayer");if(!layer){stopWalk();return}
    const i=Math.floor(Math.random()*S.gerbils.length);
    const free=spots.filter(p=>!gpos.some(q=>q.x===p.x&&q.y===p.y));
    if(!free.length)return;
    const to={...rnd(free),f:Math.random()<.5};gpos[i]=to;
    const g=layer.querySelector(`[data-i="${i}"]`);if(g){g.style.transform=place(to);layer.appendChild(g)}
  },3200);
}

/* ---------- beginscherm ---------- */
function home(){
  stopWalk();closeModal();
  const m=known(), n=ITEMS.length, ng=S.gerbils.length, sel=selected(), ms=known(sel);
  const nextAt=m<FIRST?FIRST:FIRST+gerbilsFor(m)*EVERY, prevAt=m<FIRST?0:nextAt-EVERY, need=nextAt-prevAt, got=m-prevAt;
  const H=houseHTML(), full=ng>=MAXG;
  $("#app").innerHTML=`
  <div class="top"><h1>Rennmaus-Revier</h1><div class="seeds" title="Zonnebloempitten">${SEED}<span>${S.seeds}</span></div></div>
  <div><div class="tank">${H.svg}</div>
    <div class="tankinfo"><span>${ng?"Tik op een gerbil om haar te aaien of te voeren.":""}</span><span>${SEGS.length>segsShown()?"Hoe meer je kent, hoe verder ze graven.":"Alle gangen zijn gegraven!"}</span></div></div>
  <div class="panel">
    <h2>${m===n?"Alles gekend!":full?"Op weg naar een gouden pit":"Op weg naar de volgende gerbil"}</h2>
    ${m===n?`<p>Je kent alle ${n} opgaven. Herhaal af en toe om ze vast te houden.</p>`:`<div class="paws" aria-label="${got} van ${need}">${Array.from({length:need},(_,i)=>PIP(i<got)).join("")}<span class="muted small">nog ${need-got} · ${m} van ${n} opgaven gekend</span></div>`}
    <p class="small muted" style="margin:8px 0 0">Een opgave is gekend als je hem twee keer achter elkaar goed hebt.</p>
  </div>
  <div class="panel">
    <h2 style="font-size:1.12rem">Wat wil je oefenen?</h2>
    <div class="chips">${TOPICS.map(t=>{const l=ofTopic(t.id);return `<button class="chip" aria-pressed="${S.sel.includes(t.id)}" data-t="${t.id}">${esc(t.name)} <span>${known(l)}/${l.length}</span></button>`}).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn" id="go" ${sel.length?"":"disabled"}>${sel.length&&ms===sel.length?"Herhalen":"Oefenen"}</button><button class="ghost" id="uit">Uitleg</button></div>
  </div>
  <div class="panel">
    <div class="row" style="justify-content:space-between"><h2 style="font-size:1.12rem">Der Laden</h2><span class="small muted">Spullen voor het terrarium</span></div>
    <div class="shop">${SHOP.map(it=>{
      const own=has(it.id), lock=it.needs&&!has(it.needs), can=S.seeds>=it.prijs;
      return `<div class="item ${own?"owned":""}"><div class="nm">${esc(it.nl)}</div><div class="de">${esc(it.de)}</div>
        <div class="state">${own?"In het terrarium":lock?"Eerst de verdieping kopen":it.plek||""}</div>
        ${own?"":`<button data-buy="${it.id}" ${!lock&&can?"":"disabled"}>${SEED}${it.prijs}</button>`}</div>`}).join("")}</div>
  </div>`;
  $("#go").onclick=startRound;$("#uit").onclick=()=>uitleg(S.sel[0]||TOPICS[0].id);
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const t=b.dataset.t;S.sel=S.sel.includes(t)?S.sel.filter(x=>x!==t):[...S.sel,t];save();home()});
  document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{
    const it=SHOP.find(x=>x.id===b.dataset.buy);if(!it||has(it.id)||S.seeds<it.prijs)return;
    S.seeds-=it.prijs;S.items.push(it.id);save();home();window.scrollTo({top:0,behavior:"smooth"});
  });
  document.querySelectorAll(".gb").forEach(g=>{
    g.addEventListener("click",()=>gerbilModal(+g.dataset.i));
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();gerbilModal(+g.dataset.i)}});
  });
  startWalk(H.spots);
}
function closeModal(){const o=document.getElementById("ov");if(o)o.remove()}
function modal(html){closeModal();const o=document.createElement("div");o.className="overlay";o.id="ov";o.innerHTML=`<div class="modal" role="dialog">${html}</div>`;document.body.appendChild(o);return o}
function gerbilModal(i){
  const g=S.gerbils[i];if(!g)return;
  const o=modal(`<h2>${esc(g.name)}</h2>${gerbilSVG(g,"big")}
    <label for="gn" class="small muted">Naam</label><input id="gn" type="text" maxlength="16" value="${esc(g.name)}">
    <div class="row" style="justify-content:center"><button class="btn" id="feed" ${S.seeds>=3?"":"disabled"}>Voeren · 3 ${SEED.replace('<svg','<svg style="width:14px;height:18px;vertical-align:-3px"')}</button><button class="ghost" id="close">Klaar</button></div>
    <p class="small muted" id="fmsg" style="margin:0">Een gerbil eet graag zonnebloempitten. Ze springt van blijdschap.</p>`);
  const big=o.querySelector("svg.big");
  o.querySelector("#feed").onclick=()=>{
    if(S.seeds<3)return;S.seeds-=3;save();
    big.classList.remove("hop");void big.getBoundingClientRect();big.classList.add("hop");
    o.querySelector("#fmsg").textContent=rnd(["Mmm, lecker!","Ze knabbelt vrolijk.","Danke schön!","Ze maakt een sprongetje."]);
    o.querySelector("#feed").disabled=S.seeds<3;
  };
  o.querySelector("#close").onclick=()=>{const v=o.querySelector("#gn").value.trim();if(v){g.name=v;save()}home()};
}

/* ---------- uitleg ---------- */
function uitleg(t){
  stopWalk();
  $("#app").innerHTML=`<div class="top"><h1>Uitleg</h1><button class="ghost" id="back">Terug</button></div>
  <div class="tabs">${TOPICS.map(x=>`<button class="chip" aria-pressed="${x.id===t}" data-t="${x.id}">${esc(x.name)}</button>`).join("")}</div>
  <div class="panel uitleg">${UITLEG[t]||""}</div>
  <div class="row"><button class="btn" id="go2">Oefen dit onderwerp</button></div>`;
  $("#back").onclick=home;
  document.querySelectorAll(".tabs .chip").forEach(b=>b.onclick=()=>uitleg(b.dataset.t));
  $("#go2").onclick=()=>{S.sel=[t];save();startRound()};
}

/* ---------- oefenen ---------- */
let Q=[],qi=0,review=false,lastInput=null;
function startRound(){
  const sel=selected();if(!sel.length)return home();
  const open=sel.filter(it=>!ST(it).ok);
  review=!open.length;
  const pool=review?shuffle(sel):shuffle(open).sort((a,b)=>(ST(b).w>0)-(ST(a).w>0)||ST(b).s-ST(a).s);
  Q=pool.slice(0,8).map(it=>({it,retry:false}));qi=0;ask();
}
const LET=/[A-Za-zÄÖÜäöüß]*$/;
function parse(txt){
  const blanks=[];let html="";
  const parts=txt.split(/\[\[(.*?)\]\]/);
  for(let i=0;i<parts.length;i++){
    if(i%2===0){html+=parts[i];continue}
    const [ans,why="",cue=""]=parts[i].split("|");
    const stem=html.match(LET)[0];html=html.slice(0,html.length-stem.length);
    const alts=ans.split("/");
    const len=stem?Math.max(3.5,...alts.map(a=>a.length+2)):Math.max(4,...alts.map(a=>a.length+1.5));
    blanks.push({stem,alts,why,cue});
    html+=`<span class="bw">${stem?`<span class="stem">${esc(stem)}</span>`:""}<input class="blank" data-b="${blanks.length-1}" style="width:${len}ch" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="${esc(cue||"invullen")}" placeholder="${esc(cue)}"></span>`;
  }
  return {html,blanks};
}
function ask(){
  if(qi>=Q.length)return roundEnd();
  const {it}=Q[qi], topic=TOPICS.find(t=>t.id===it.t);
  const dots=Q.map((_,i)=>`<span class="${i<qi?"done":""}"></span>`).join("");
  let body="";
  if(it.kind==="mc"){
    const opts=it.opts?it.opts.slice():shuffle([it.a,...shuffle(it.pool).slice(0,3)]);
    body=`<div class="q">${esc(it.q)}</div><div class="opts">${opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div>`;
  }else{
    const P=parse(it.txt);it._p=P;
    body=`<div class="sent">${P.html}</div>${it.nl?`<div class="nl">${esc(it.nl)}</div>`:""}
      <div class="keys">${["ä","ö","ü","ß","Ä","Ö","Ü"].map(k=>`<button type="button" class="key">${k}</button>`).join("")}</div>
      <button class="btn" id="chk">Controleer</button>`;
  }
  $("#app").innerHTML=`<div class="qhead"><button class="ghost" id="stop">Stoppen</button><div class="dots">${dots}</div><div class="seeds">${SEED}<span>${S.seeds}</span></div></div>
  <div class="panel"><div class="mode">${review?"Herhaling · ":""}${esc(topic.name)}</div><div class="ins">${esc(it.ins)}</div>${body}<div id="fb"></div></div>`;
  $("#stop").onclick=home;
  if(it.kind==="mc"){
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=b.textContent===it.a;
      document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===it.a)x.classList.add("good")});
      if(!ok)b.classList.add("bad");
      result(it,ok,ok?"":`<div>Goed is: <span class="ans">${esc(it.a)}</span></div>${it.why?`<div class="small">${esc(it.why)}</div>`:""}`, it.why&&ok?`<div class="small">${esc(it.why)}</div>`:"");
    });
  }else{
    const ins=[...document.querySelectorAll("input.blank")];
    lastInput=ins[0];ins.forEach(x=>x.addEventListener("focus",()=>lastInput=x));
    ins.forEach((x,i)=>x.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(ins[i+1])ins[i+1].focus();else check(it)}}));
    try{ins[0].focus({preventScroll:true})}catch(e){}
    document.querySelectorAll(".key").forEach(k=>{k.addEventListener("pointerdown",e=>e.preventDefault());k.onclick=()=>{
      const inp=lastInput;if(!inp||inp.disabled)return;const p=inp.selectionStart??inp.value.length;
      inp.value=inp.value.slice(0,p)+k.textContent+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+1,p+1)}});
    $("#chk").onclick=()=>check(it);
  }
}
const clean=s=>s.replace(/ /g," ").replace(/\s+/g," ").trim();
const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ß/g,"ss");
function judge(b,raw,strict,plural){
  const t=clean(raw);if(!t)return {ok:false,why:"leeg"};
  const forms=b.alts.flatMap(a=>{const full=b.stem+a;return a&&b.stem?[full,a]:[full]});
  if(b.alts.some(a=>a==="")) forms.push("-");
  if(forms.includes(t))return {ok:true};
  const lo=t.toLowerCase();
  const cf=x=>x?x[0].toLowerCase()+x.slice(1):x;
  if(forms.some(f=>cf(f)===cf(t)))return {ok:true};
  if(forms.some(f=>f.toLowerCase()===lo))return strict?{ok:false,why:"hoofdletter"}:{ok:true};
  if(forms.some(f=>strip(f.toLowerCase())===strip(lo)))return {ok:false,why:"umlaut"};
  if(plural&&forms.some(f=>f.replace(/^die /,"").toLowerCase()===lo))return {ok:false,why:"geendie"};
  return {ok:false,why:"fout"};
}
const WHYLBL={leeg:"niet ingevuld",hoofdletter:"let op de hoofdletter",umlaut:"let op de umlaut of ß",geendie:"lidwoord die vergeten",fout:""};
function check(it){
  const P=it._p, ins=[...document.querySelectorAll("input.blank")];
  if(ins.every(x=>!clean(x.value))){ins[0].focus();return}
  const res=P.blanks.map((b,i)=>judge(b,ins[i].value,it.strict,it.plural));
  ins.forEach((x,i)=>{x.disabled=true;x.classList.add(res[i].ok?"ok":"bad")});
  document.querySelectorAll(".key,#chk").forEach(x=>x.disabled=true);
  const ok=res.every(r=>r.ok);
  const wrong=P.blanks.map((b,i)=>({b,r:res[i],typed:clean(ins[i].value)})).filter(x=>!x.r.ok);
  const fix=wrong.map(({b,r,typed})=>`<li><span class="ans">${esc(b.stem+b.alts[0])}</span>${b.alts.length>1?` <span class="muted">(of ${esc(b.alts.slice(1).map(a=>b.stem+a).join(", "))})</span>`:""}${WHYLBL[r.why]?`<span class="tag">${WHYLBL[r.why]}</span>`:""}${b.why?`<div class="small">${esc(b.why)}</div>`:""}</li>`).join("");
  const right=ok?P.blanks.filter(b=>b.why).slice(0,3).map(b=>`<li><span class="ans">${esc(b.stem+b.alts[0])}</span> <span class="small">${esc(b.why)}</span></li>`).join(""):"";
  result(it,ok,wrong.length?`<div>${wrong.length===1?"Dit moet anders:":`Deze ${wrong.length} moeten anders:`}</div><ul>${fix}</ul>`:"",right?`<ul class="small">${right}</ul>`:"");
}
function result(it,ok,wrongHtml,okHtml){
  const st=ST(it);let msg="",extra="";
  if(ok){
    S.seeds+=1;st.s++;
    if(!st.ok&&st.s>=2){st.ok=true;S.seeds+=2;extra=" · <b>gekend!</b> +2"}
    msg=`<div class="fb ok"><div class="big">${rnd(["Sehr gut!","Super!","Toll!","Prima!","Klasse!"])}</div><div>+1 zonnebloempit${extra}${!st.ok?" · nog één keer goed en je kent hem":""}</div>${okHtml||""}</div>`;
  }else{
    st.s=0;st.w++;
    msg=`<div class="fb no"><div class="big">Bijna!</div>${wrongHtml}<div class="small muted">Deze komt straks nog een keer terug. <a href="#" id="tip">Uitleg bekijken</a></div></div>`;
    if(!Q[qi].retry)Q.splice(Math.min(qi+3,Q.length),0,{it,retry:true});
  }
  save();
  $("#fb").innerHTML=msg+`<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="next">Verder</button></div>`;
  document.querySelectorAll(".qhead .seeds span").forEach(x=>x.textContent=S.seeds);
  const tip=document.getElementById("tip");
  if(tip)tip.onclick=e=>{e.preventDefault();const o=modal(`<div class="uitleg" style="text-align:left;max-height:70vh;overflow:auto;width:100%">${UITLEG[it.t]}</div><button class="btn" id="tclose">Terug naar de opgave</button>`);o.querySelector(".modal").style.maxWidth="560px";o.querySelector("#tclose").onclick=closeModal};
  $("#next").focus({preventScroll:true});
  try{$("#fb").scrollIntoView({behavior:"smooth",block:"nearest"})}catch(e){}
  $("#next").onclick=()=>{qi++;if(!adopt(ask))ask()};
}
function adopt(then){
  const m=known();
  if(S.gerbils.length<gerbilsFor(m)){
    const used=S.gerbils.map(g=>g.name),free=GNAMES.filter(n=>!used.includes(n));
    const g={name:rnd(free.length?free:GNAMES),coat:S.gerbils.length===0?0:Math.floor(Math.random()*COATS.length)};
    S.gerbils.push(g);save();
    const o=modal(`<h2>Er komt een gerbil bij!</h2>${gerbilSVG(g,"big")}<p class="small muted" style="margin:0">${S.gerbils.length===1?`Je kent je eerste ${FIRST} opgaven.`:`Je kent weer ${EVERY} opgaven.`} Gerbils wonen graag samen.</p>
      <label for="an" class="small">Hoe heet ze?</label><input id="an" type="text" maxlength="16" value="${esc(g.name)}"><button class="btn" id="aok">Willkommen!</button>`);
    o.querySelector("#aok").onclick=()=>{const v=o.querySelector("#an").value.trim();if(v)g.name=v;save();closeModal();then()};
    return true;
  }
  if(goldFor(m)>S.gold){
    S.gold=goldFor(m);S.seeds+=15;save();
    const o=modal(`<h2>Een gouden zonnebloempit!</h2><svg class="big" viewBox="0 0 18 24" style="width:80px"><path d="M9 1c5 4 7 10 6 15-1 4-4 6-6 7-2-1-5-3-6-7C2 11 4 5 9 1z" fill="#e9b21c" stroke="#a07a10"/></svg><p class="small muted" style="margin:0">Het terrarium zit vol gerbils. Voor elke ${EVERY} gekende opgaven krijg je nu 15 extra pitten.</p><button class="btn" id="aok">Super!</button>`);
    o.querySelector("#aok").onclick=()=>{closeModal();then()};return true;
  }
  return false;
}
function roundEnd(){
  if(adopt(roundEnd))return;
  const sel=selected();
  $("#app").innerHTML=`<div class="panel" style="text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center">
    <h2>Ronde klaar!</h2><p>Van wat je nu oefent ken je er <b>${known(sel)}</b> van de ${sel.length}. Je hebt <b>${S.seeds}</b> zonnebloempitten.</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">Nog een ronde</button><button class="ghost" id="h">Naar het terrarium</button></div></div>`;
  $("#again").onclick=startRound;$("#h").onclick=home;
}
home();
</script>
