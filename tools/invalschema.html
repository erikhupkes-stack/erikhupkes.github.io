<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A4D94">
<title>Invalschema Move4u</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#16233F; --muted:#5A6680; --line:#D9DFEA;
  --court:#1A4D94; --court-soft:#E1E9F5; --floor:#FF7F04; --floor-dark:#B35700; --floor-soft:#FFEBD6; --bench:#B8C1D2;
  --band:#1A4D94; --band-ink:#FFFFFF; --bad:#C62828; --bad-soft:#FBE3E3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1628; --surface:#172240; --ink:#EAF0F9; --muted:#9DAAC4; --line:#2A3A5E;
    --court:#7FA6E6; --court-soft:#203660; --floor:#FF8F26; --floor-dark:#FFB066; --floor-soft:#3B2712; --bench:#3E4C6B;
    --band:#12366A; --bad:#FF7B7B; --bad-soft:#3A1C22;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1628; --surface:#172240; --ink:#EAF0F9; --muted:#9DAAC4; --line:#2A3A5E;
  --court:#7FA6E6; --court-soft:#203660; --floor:#FF8F26; --floor-dark:#FFB066; --floor-soft:#3B2712; --bench:#3E4C6B;
  --band:#12366A; --bad:#FF7B7B; --bad-soft:#3A1C22;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,summary,label{touch-action:manipulation}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;line-height:1.1;margin:0}

/* Kopbalk */
.band{background:var(--band);color:var(--band-ink);border-bottom:4px solid var(--floor)}
.band-inner{max-width:640px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:12px}
.logo{height:52px;width:auto;flex:none;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 2px 3px rgba(0,0,0,.25))}
h1{font-size:1.9rem;font-weight:800}
.sub{margin:0;font-size:.9rem;opacity:.85}

/* Set-navigatie, blijft bovenaan staan tijdens scrollen */
.setnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.setnav-inner{max-width:640px;margin:0 auto;display:flex;gap:6px;padding:8px 14px}
.setnav a{flex:1;text-align:center;text-decoration:none;font-weight:700;color:var(--court);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 0;min-height:44px;line-height:24px}
.setnav a.wide{flex:1.6}

main{max-width:640px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom,0px))}
section,details.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:1.4rem;font-weight:700;color:var(--court);margin-bottom:8px}

/* Aanwezigheid */
.presence-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.count{color:var(--muted);font-weight:600;font-size:.95rem}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:6px}
.chip{position:relative;display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 12px;border-radius:12px;border:2px solid var(--court);background:var(--court-soft);font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none}
.chip::before{content:"";width:20px;height:20px;border-radius:50%;background:var(--court);flex:none;box-shadow:inset 0 0 0 4px var(--court-soft)}
.chip.absent{border-color:var(--line);background:transparent;color:var(--muted);text-decoration:line-through}
.chip.absent::before{background:transparent;box-shadow:inset 0 0 0 2px var(--bench)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:focus-within{outline:3px solid var(--floor);outline-offset:2px}
.hint{color:var(--muted);font-size:.9rem;margin:10px 0 0}

/* Team bewerken */
details.card{padding:0}
details.card summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;color:var(--court);display:flex;justify-content:space-between;align-items:center;min-height:52px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:1.5rem;line-height:1}
details.card[open] summary::after{content:"–"}
.edit{padding:0 14px 14px}
.add{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.roster{list-style:none;padding:0;margin:12px 0 0}
.roster li{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-top:1px solid var(--line)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;min-height:48px;cursor:pointer;background:var(--floor);color:#fff}
button:active{transform:scale(.98)}
button.ghost{background:transparent;color:var(--court);border:2px solid var(--court)}
button.del{background:transparent;color:var(--floor-dark);padding:8px 12px;min-height:44px;font-weight:600}
button:focus-visible,input:focus-visible,summary:focus-visible,.setnav a:focus-visible{outline:3px solid var(--court);outline-offset:2px}

/* Speelwijze-schakelaar */
.band-inner > div:not(.seg){min-width:0;flex:1}
@media (max-width:519px){ .band-inner{gap:10px;padding:10px 12px} .logo{height:44px} .band h1{font-size:1.55rem} .sub{font-size:.82rem} }
.seg{margin-left:auto;flex:none;display:flex;flex-direction:column;gap:3px;padding:3px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:12px}
.seg button{background:transparent;color:var(--band-ink);min-height:40px;padding:6px 10px;border-radius:9px;font-size:.95rem;line-height:1.1;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--floor);color:#fff}
@media (min-width:520px){ .seg{flex-direction:row} .seg button{min-height:44px} }
.msg{padding:12px;border-radius:10px;background:var(--floor-soft);margin:0}

/* Sets */
.set{border-left:6px solid var(--floor)}
.set h3{font-size:1.5rem;font-weight:800;margin-bottom:8px}
.set.extra{border-left-style:dashed;border-left-color:var(--bench);border-style:dashed}
.set.extra h3 small{font-family:"Barlow",sans-serif;font-size:.95rem;font-weight:600;color:var(--muted);margin-left:6px}
.setnav a.opt{border-style:dashed;color:var(--muted)}
.over-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.over-head h2{margin:0}
button.small{min-height:44px;padding:8px 12px;font-size:.92rem}
th.opt,td.opt{opacity:.75}
.label{font-weight:700;font-size:.85rem;color:var(--muted);margin-top:4px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 10px}
.names span{background:var(--court-soft);padding:8px 10px;border-radius:8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench{color:var(--muted);font-size:.95rem;margin:0 0 10px}
.subs{list-style:none;padding:0;margin:6px 0 0}
.subs li{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px dashed var(--line);font-size:1.05rem}
.subs .in{font-weight:700;color:var(--floor-dark)}
.subs .arrow{color:var(--muted);font-size:.9rem}

/* Overzicht */
table{border-collapse:collapse;width:100%}
th,td{padding:9px 2px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:0;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th{font-family:"Barlow Condensed",sans-serif;font-size:1.05rem;color:var(--court)}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid var(--court);vertical-align:middle}
.dot.full{background:var(--court)}
.dot.h1{background:linear-gradient(90deg,var(--court) 50%,transparent 50%)}
.dot.h2{background:linear-gradient(90deg,transparent 50%,var(--court) 50%)}
.dot.none{border-color:var(--bench);border-style:dashed}
.total{font-weight:700;white-space:nowrap}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;color:var(--muted);font-size:.88rem;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:16px;height:16px}

/* Veld per set: rotatie en service */
.set-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.set-head h3{margin:0}
.rate4{display:flex;gap:5px}
.rate4 button{min-width:44px;min-height:44px;padding:0;font-family:"Barlow Condensed",sans-serif;font-size:1.35rem;font-weight:800;border-radius:10px}
.r0{background:var(--bad);color:#fff}
.r1{background:var(--court-soft);color:var(--ink);box-shadow:inset 0 0 0 2px var(--court)}
.r2{background:var(--court);color:var(--surface)}
.r3{background:var(--floor);color:#fff}
.court{border:3px solid var(--court);border-radius:16px;overflow:hidden;background:var(--floor-soft)}
.net{background:var(--court);color:var(--surface);text-align:center;font-weight:800;letter-spacing:.08em;font-size:.9rem;padding:6px 0}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.pos{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:84px;padding:20px 4px 8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;font-weight:700;line-height:1.1}
.pos .pn{position:absolute;top:5px;left:8px;font-size:.85rem;color:var(--muted);font-weight:700}
.pos .pname{font-size:1.08rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos .ds{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:18px}
.pos .srv{font-size:.78rem;font-weight:600;color:var(--muted)}
.pos.on{border:2px solid var(--court);box-shadow:inset 0 -5px 0 var(--court)}
.pos.sel{outline:3px solid var(--floor);outline-offset:1px}
.d{font-style:normal;font-size:.75rem;font-weight:800;min-width:17px;height:17px;line-height:17px;border-radius:5px;text-align:center}
.d0{background:var(--bad);color:#fff}.d1{background:var(--court-soft);color:var(--ink)}.d2{background:var(--court);color:var(--surface)}.d3{background:var(--floor);color:#fff}
.phase{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.phase button{border-radius:0;background:var(--surface);color:var(--ink);font-weight:600}
.phase button[aria-pressed="true"]{background:var(--court);color:var(--surface)}
.turnrow{display:grid;grid-template-columns:2fr 3fr;gap:8px;margin-top:8px}
.status{color:var(--muted);text-align:center;margin:8px 0 4px;font-size:.95rem;min-height:1.4em}
.status button.link{min-height:32px;padding:2px 4px;font-size:.92rem}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;padding:10px;border-radius:10px;background:var(--court-soft)}
.pick .label{width:100%;margin:0 0 2px}
.pick button{min-height:44px;padding:8px 12px;background:var(--surface);color:var(--ink);border:2px solid var(--court)}
.pick .cancel{border-color:var(--line);color:var(--muted)}
button.link{background:transparent;color:var(--court);padding:8px 4px;min-height:44px;font-weight:600;text-decoration:underline}
.stats td,.stats th{padding:8px 3px}
.stats td.n0{color:var(--bad);font-weight:700}
.stats td.n3{color:var(--floor-dark);font-weight:700}
.stats td.avg{font-weight:800}
.stats .zero{color:var(--bench)}
.row2{display:flex;gap:8px;margin-top:12px}
.row2 button{flex:1}
.danger{background:transparent;color:var(--bad);border:2px solid var(--bad)}
@media (max-width:360px){ .rate4 button{min-width:40px} .pos .pname{font-size:.98rem} }

/* Actiebalk onderaan, binnen bereik van je duim */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.actionbar-inner{max-width:640px;margin:0 auto;display:flex;gap:8px}
.actionbar button{flex:1}
#printBtn{display:none}
@media (min-width:700px){ #printBtn{display:block;flex:0 0 auto} .logo{height:64px} h1{font-size:2.2rem} }

@media print{
  body{background:#fff;color:#000} .band{background:#fff;color:#000} .logo{filter:none}
  .noprint,.setnav,.actionbar{display:none!important} main{padding-bottom:0} section{break-inside:avoid;border-color:#999}
}
</style>
</head>

<script>
(function(){
  var KEY = 'rotatie-team-v1';
  // Eerlijk verdeeld over 4 sets; set 5 wordt pas daarna bepaald (alleen als hij gespeeld wordt).
  var state = { players: [], sets: 4, seed: 1, mode: 'half', with5: false };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && Array.isArray(saved.players)) state.players = saved.players;
    if (saved && saved.mode === 'full') state.mode = 'full';
    if (saved && saved.seed) state.seed = saved.seed;
  } catch(e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify({players: state.players, mode: state.mode, seed: state.seed})); } catch(e) {} }

  // Wedstrijdstand: per set de rotatie (hoe vaak doorgedraaid), voor/na wissel en wissels bij blessure,
  // plus alle servicecijfers (op naam, zodat ze blijven kloppen als de indeling verandert).
  var GKEY = 'invalschema-wedstrijd-v2', SKEY = 'invalschema-seizoen-v1';
  var game = { sig: '', sets: {}, serves: [] }, season = [], ui = { pick: null, flash: {} };
  try { var g0 = JSON.parse(localStorage.getItem(GKEY) || 'null'); if (g0 && g0.sets && g0.serves) game = g0; } catch(e) {}
  try { season = JSON.parse(localStorage.getItem(SKEY) || '[]') || []; } catch(e) {}
  try { localStorage.removeItem('invalschema-wedstrijd-v1'); } catch(e) {}
  function saveGame(){ try { localStorage.setItem(GKEY, JSON.stringify(game)); } catch(e) {} }
  function saveSeason(){ try { localStorage.setItem(SKEY, JSON.stringify(season)); } catch(e) {} }
  function setState(s){ return game.sets[s] || (game.sets[s] = { t: 0, after: false, swaps: { b: {}, a: {} } }); }
  var RATING = ['fout', 'simpel', 'lastig', 'ace'];

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function rng(seed){ return function(){ seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
  function shuffled(arr, seed){
    var a = arr.slice(), r = rng(seed);
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function buildSchedule(names, sets, seed){
    // Iedereen speelt elke set minstens een helft: n-6 spelers alleen 1e helft, n-6 alleen 2e helft, rest hele set.
    var n = names.length, k = n - 6, order = shuffled(names.map(function(_, i){ return i; }), seed);
    var rank = {}; order.forEach(function(p, i){ rank[p] = i; });
    var count = names.map(function(){ return 0; }), starts = names.map(function(){ return 0; });
    var result = [];
    for (var s = 0; s < sets; s++) {
      var rot = function(a, b){ return ((rank[a] + s * 5) % n) - ((rank[b] + s * 5) % n); };
      var ids = names.map(function(_, i){ return i; });
      // wie tot nu toe het meest speelde, speelt deze set een halve set
      ids.sort(function(a, b){ return (count[b] - count[a]) || rot(a, b); });
      var half = ids.slice(0, 2 * k), full = ids.slice(2 * k);
      // van de halve-setters begint wie het minst vaak in de basis stond
      half.sort(function(a, b){ return (starts[a] - starts[b]) || rot(a, b); });
      var h1 = half.slice(0, k), h2 = half.slice(k);
      var first = full.concat(h1), second = full.concat(h2);
      first.forEach(function(p){ count[p]++; starts[p]++; });
      second.forEach(function(p){ count[p]++; });
      result.push({ first: first, second: second, subs: h2.map(function(p, i){ return [p, h1[i]]; }) });
    }
    return { sets: result, count: count };
  }

  function buildFullSetSchedule(names, sets, seed){
    // Geen wissels binnen een set: per set spelen de 6 spelers met de minste sets tot nu toe.
    // Bij gelijke stand gaat voor wie het langst op de bank zat, zodat niemand onnodig twee sets achter elkaar zit.
    var n = names.length, order = shuffled(names.map(function(_, i){ return i; }), seed);
    var rank = {}; order.forEach(function(p, i){ rank[p] = i; });
    var count = names.map(function(){ return 0; }), last = names.map(function(){ return -1; });
    var result = [];
    for (var s = 0; s < sets; s++) {
      var ids = names.map(function(_, i){ return i; });
      ids.sort(function(a, b){
        return (count[a] - count[b]) || (last[a] - last[b]) ||
          (((rank[a] + s * 5) % n) - ((rank[b] + s * 5) % n));
      });
      var court = ids.slice(0, 6);
      court.forEach(function(p){ count[p] += 2; last[p] = s; });
      result.push({ first: court, second: court, subs: [] });
    }
    return { sets: result, count: count };
  }

  function renderMode(){
    var full = state.mode === 'full';
    document.querySelectorAll('[data-mode]').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)); });
    $('sub').textContent = full ? '4 sets, geen wissels in een set' : '4 sets, iedereen speelt elke set';
  }

  function renderPlayers(){
    var box = $('players'), present = state.players.filter(function(p){ return p.present; }).length;
    $('count').textContent = state.players.length ? present + ' van ' + state.players.length : '';
    $('presence').style.display = state.players.length ? '' : 'none';
    if (!state.players.length) $('editTeam').open = true;
    box.innerHTML = state.players.map(function(p, i){
      return '<label class="chip' + (p.present ? '' : ' absent') + '">' +
        '<input type="checkbox" data-toggle="' + i + '"' + (p.present ? ' checked' : '') + '>' + esc(p.name) + '</label>';
    }).join('');
    $('roster').innerHTML = state.players.map(function(p, i){
      return '<li><span>' + esc(p.name) + '</span><button type="button" class="del" data-del="' + i + '">Verwijder</button></li>';
    }).join('');
  }

  function renderOutput(){
    var out = $('output'), nav = $('setnav');
    var present = state.players.filter(function(p){ return p.present; }).map(function(p){ return p.name; });
    var full = state.mode === 'full';
    var seed = state.seed;
    if (present.length < 6 || (!full && present.length > 12)) {
      nav.innerHTML = ''; $('statsBox').innerHTML = '';
      out.innerHTML = state.players.length ? '<section><p class="msg">' + (present.length < 6
        ? 'Er zijn ' + present.length + ' spelers aanwezig. Je hebt er minstens 6 nodig voor een schema.'
        : 'Met ' + present.length + ' spelers lukt het niet binnen zes wissels per set. Zet er maximaal 12 op aanwezig, of kies "Alleen hele sets".') + '</p></section>'
        : '<section><p class="msg">Open "Team bewerken" en voeg je spelers toe. Je team wordt op deze telefoon onthouden.</p></section>';
      return;
    }
    // Het schema is per set opgebouwd: set 5 verandert niets aan sets 1–4,
    // en kiest juist wie na 4 sets het minst speelde.
    var sch = full ? buildFullSetSchedule(present, state.sets + 1, seed) : buildSchedule(present, state.sets + 1, seed);
    var shown = state.with5 ? state.sets + 1 : state.sets;
    var total = present.map(function(_, i){
      var c = 0;
      sch.sets.slice(0, shown).forEach(function(st){ if (st.first.indexOf(i) >= 0) c++; if (st.second.indexOf(i) >= 0) c++; });
      return c;
    });
    // Andere aanwezigen, speelwijze of indeling: rotatiestand per set opnieuw beginnen (cijfers blijven).
    var sig = present.join('|') + '#' + state.mode + '#' + seed;
    if (game.sig !== sig) { game.sig = sig; game.sets = {}; ui.pick = null; saveGame(); }
    var navHtml = '<div class="setnav-inner">';
    for (var k = 0; k < state.sets; k++) navHtml += '<a href="#set' + (k + 1) + '">S' + (k + 1) + '</a>';
    navHtml += '<a class="opt" href="#set5">S5?</a>';
    nav.innerHTML = navHtml + '<a class="wide" href="#overzicht">Overzicht</a></div>';

    var html = '';
    if (present.length === 6) html += '<section><p class="msg">Precies 6 spelers: iedereen speelt alles, er zijn geen wissels nodig.</p></section>';
    if (full && present.length > 6) {
      var slots = 6 * state.sets, lo = Math.floor(slots / present.length), extra = slots % present.length;
      html += '<section><p class="msg">' + (extra === 0
        ? 'Met ' + present.length + ' spelers speelt iedereen precies ' + lo + ' sets.'
        : 'Met ' + present.length + ' spelers kan het niet precies gelijk: ' + extra + (extra === 1 ? ' speler speelt ' : ' spelers spelen ') + (lo + 1) +
          ' sets, de rest ' + lo + '. Zie het overzicht wie dat zijn.') + '</p></section>';
    }
    sch.sets.forEach(function(set, s){ html += courtCard(set, s, present, full); });

    html += '<section id="overzicht"><div class="over-head"><h2>Overzicht</h2>' +
      '<button type="button" class="ghost small" id="set5Btn" aria-pressed="' + state.with5 + '">' +
      (state.with5 ? 'Set 5 weghalen' : 'Set 5 gespeeld') + '</button></div><table><thead><tr><th>Speler</th>';
    for (var s = 0; s < shown; s++) html += '<th' + (s === state.sets ? ' class="opt"' : '') + '>S' + (s + 1) + '</th>';
    html += '<th>Sets</th></tr></thead><tbody>';
    present.forEach(function(name, i){
      html += '<tr><td>' + esc(name) + '</td>';
      sch.sets.slice(0, shown).forEach(function(set, s){
        var a = set.first.indexOf(i) >= 0, b = set.second.indexOf(i) >= 0;
        var cls = a && b ? 'full' : a ? 'h1' : b ? 'h2' : 'none';
        var t = a && b ? 'hele set' : a ? 'eerste helft' : b ? 'tweede helft' : 'bank';
        html += '<td' + (s === state.sets ? ' class="opt"' : '') + '><span class="dot ' + cls + '" role="img" aria-label="' + t + '"></span></td>';
      });
      html += '<td class="total">' + String(total[i] / 2).replace('.', ',') + '</td></tr>';
    });
    html += '</tbody></table><div class="legend">' + (full
      ? '<span><i class="dot full"></i>speelt</span><span><i class="dot none"></i>bank</span>'
      : '<span><i class="dot full"></i>hele set</span><span><i class="dot h1"></i>eerste helft</span>' +
        '<span><i class="dot h2"></i>tweede helft</span>') + '</div>' +
      '<p class="hint">' + (state.with5 ? 'Telling inclusief set 5. ' : 'Telling over 4 sets. ') + 'Wie net iets minder speeltijd heeft, laat je volgende wedstrijd in de basis beginnen.</p></section>';
    out.innerHTML = html;
    renderStats(present);
  }

  var GRID = [4, 3, 2, 5, 6, 1]; // zo staan de posities op het veld, net bovenaan

  function lineupFor(set, s){
    var g = setState(s), key = g.after ? 'a' : 'b';
    var line = (g.after ? set.second : set.first).slice();
    Object.keys(g.swaps[key]).forEach(function(slot){ line[+slot] = g.swaps[key][slot]; });
    return line;
  }
  function scoresOf(name, s){ return game.serves.filter(function(v){ return v.s === s && v.n === name; }); }

  function courtCard(set, s, present, full){
    var g = setState(s), line = lineupFor(set, s), extra = s === state.sets;
    var at = function(pos){ return (g.t + pos - 1) % 6; }; // slot op deze positie
    var server = present[line[at(1)]];
    var h = '<section class="set' + (extra ? ' extra' : '') + '" id="set' + (s + 1) + '">' +
      '<div class="set-head"><h3>Set ' + (s + 1) + (extra ? '<small>als die gespeeld wordt</small>' : '') + '</h3>' +
      '<div class="rate4 noprint" role="group" aria-label="Service van ' + esc(server) + ' beoordelen">' +
      RATING.map(function(t, r){ return '<button type="button" class="r' + r + '" data-rate="' + s + ':' + r + '" title="' + t + '" aria-label="' + r + ' ' + t + '">' + r + '</button>'; }).join('') +
      '</div></div>';
    if (extra) h += '<p class="bench">Gekozen op wie na 4 sets het minst heeft gespeeld.</p>';
    h += '<div class="court"><div class="net">NET</div><div class="grid6">';
    GRID.forEach(function(pos){
      var slot = at(pos), name = present[line[slot]];
      var ds = scoresOf(name, s).map(function(v){ return '<i class="d d' + v.r + '">' + v.r + '</i>'; }).join('');
      var sel = ui.pick && ui.pick.s === s && ui.pick.slot === slot;
      h += '<button type="button" class="pos' + (pos === 1 ? ' on' : '') + (sel ? ' sel' : '') + '" data-tile="' + s + ':' + slot + '">' +
        '<span class="pn">' + pos + '</span><span class="pname">' + esc(name) + '</span>' +
        (pos === 1 ? '<span class="srv">serveert</span>' : '') + '<span class="ds">' + ds + '</span></button>';
    });
    h += '</div></div>';

    var bench = present.map(function(_, i){ return i; }).filter(function(i){ return line.indexOf(i) < 0; });
    if (ui.pick && ui.pick.s === s && bench.length) {
      h += '<div class="pick noprint"><span class="label">Wie komt erin voor ' + esc(present[line[ui.pick.slot]]) + '?</span>' +
        bench.map(function(b){ return '<button type="button" data-in="' + b + '">' + esc(present[b]) + '</button>'; }).join('') +
        '<button type="button" class="cancel" data-cancel>Annuleer</button></div>';
    }
    if (!full && set.subs.length) {
      h += '<div class="phase noprint" role="group" aria-label="Opstelling">' +
        '<button type="button" data-phase="' + s + ':0" aria-pressed="' + !g.after + '">Voor wissel</button>' +
        '<button type="button" data-phase="' + s + ':1" aria-pressed="' + g.after + '">Na wissel</button></div>';
    }
    h += '<div class="turnrow noprint"><button type="button" class="ghost" data-back="' + s + '"' + (g.t ? '' : ' disabled') + '>Terug</button>' +
      '<button type="button" data-turn="' + s + '">Doordraaien</button></div>';
    var f = ui.flash[s];
    h += '<p class="status" aria-live="polite">' + (f ? esc(f) + ' <button type="button" class="link" data-unscore="' + s + '">ongedaan</button>'
      : (g.t ? g.t + '× doorgedraaid' : 'Beginopstelling')) + '</p>';
    if (bench.length) h += '<p class="bench">Bank: ' + bench.map(function(b){ return esc(present[b]); }).join(', ') + '</p>';
    if (set.subs.length) {
      h += '<div class="label">Wissels rond 12–13 punten</div><ul class="subs">' +
        set.subs.map(function(p){ return '<li><span class="in">' + esc(present[p[0]]) + '</span><span class="arrow">erin voor</span><span>' + esc(present[p[1]]) + '</span></li>'; }).join('') + '</ul>';
    }
    return h + '</section>';
  }

  function stats(serves){
    var st = {};
    serves.forEach(function(v){
      var o = st[v.n] || (st[v.n] = { n: 0, c: [0, 0, 0, 0], sum: 0 });
      o.n++; o.c[v.r]++; o.sum += v.r;
    });
    return st;
  }
  function avg(o){ return o && o.n ? (o.sum / o.n).toFixed(1).replace('.', ',') : '–'; }
  function statsTable(rows){
    var h = '<table class="stats"><thead><tr><th>Speler</th><th>×</th><th title="fout">0</th><th title="simpel">1</th><th title="lastig">2</th><th title="ace">3</th><th>Gem</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var o = r.o || { n: 0, c: [0, 0, 0, 0], sum: 0 };
      h += '<tr><td>' + esc(r.name) + '</td><td>' + (o.n || '<span class="zero">0</span>') + '</td>' +
        o.c.map(function(c, i){ return '<td class="' + (c ? 'n' + i : 'zero') + '">' + c + '</td>'; }).join('') +
        '<td class="avg">' + avg(o) + '</td></tr>';
    });
    return h + '</tbody></table>';
  }

  function renderStats(present){
    var st = stats(game.serves), names = present.slice();
    Object.keys(st).forEach(function(n){ if (names.indexOf(n) < 0) names.push(n); });
    $('statsBox').innerHTML = '<section id="service"><h2>Service deze wedstrijd</h2>' +
      (game.serves.length ? statsTable(names.map(function(n){ return { name: n, o: st[n] }; })) +
        '<div class="legend"><span>0 = fout</span><span>1 = simpel</span><span>2 = lastig</span><span>3 = ace</span></div>' +
        '<div class="row2"><button type="button" class="danger" id="newGameBtn">Nieuwe wedstrijd</button></div>' +
        '<p class="hint">"Nieuwe wedstrijd" zet deze cijfers bij het seizoen en maakt alle sets weer leeg.</p>'
      : '<p class="hint" style="margin:0">Tik na elke service rechtsboven bij de set op 0, 1, 2 of 3. Het cijfer gaat naar wie op plek 1 serveert.</p>') +
      '</section>';
  }

  function renderSeason(){
    var box = $('seasonBox');
    if (!season.length) { box.innerHTML = ''; return; }
    var tot = {}, order = [];
    season.forEach(function(m){
      Object.keys(m.stats).forEach(function(n){
        var a = m.stats[n], o = tot[n] || (order.push(n), tot[n] = { n: 0, c: [0, 0, 0, 0], sum: 0 });
        o.n += a.n; o.sum += a.sum; a.c.forEach(function(c, i){ o.c[i] += c; });
      });
    });
    order.sort(function(a, b){ return a.localeCompare(b, 'nl'); });
    box.innerHTML = '<details class="card"><summary>Service dit seizoen (' + season.length + (season.length === 1 ? ' wedstrijd' : ' wedstrijden') + ')</summary><div class="edit">' +
      statsTable(order.map(function(n){ return { name: n, o: tot[n] }; })) +
      '<div class="row2"><button type="button" class="danger small" id="clearSeason">Seizoen wissen</button></div></div></details>';
  }

  function confirmTap(t, label){
    if (t.dataset.sure) return true;
    t.dataset.sure = '1'; t.textContent = 'Zeker? Tik nog een keer';
    setTimeout(function(){ if (t.isConnected) { delete t.dataset.sure; t.textContent = label; } }, 3000);
    return false;
  }

  function renderAll(){ renderMode(); renderPlayers(); renderOutput(); renderSeason(); }

  $('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    var input = $('nameInput');
    input.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean)
      .forEach(function(n){ state.players.push({ name: n, present: true }); });
    input.value = ''; save(); renderAll();
  });
  $('roster').addEventListener('click', function(e){
    var del = e.target.closest('[data-del]'); if (!del) return;
    var i = +del.dataset.del;
    if (del.dataset.sure) { state.players.splice(i, 1); save(); renderAll(); return; }
    del.dataset.sure = '1'; del.textContent = 'Zeker?';
    setTimeout(function(){ if (del.isConnected) { delete del.dataset.sure; del.textContent = 'Verwijder'; } }, 3000);
  });
  $('players').addEventListener('change', function(e){
    var t = e.target.dataset.toggle;
    if (t !== undefined) { state.players[+t].present = e.target.checked; save(); renderAll(); }
  });
  $('shuffleBtn').addEventListener('click', function(){
    state.seed++; save(); renderOutput();
    var first = $('set1'); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('modeBox').addEventListener('click', function(e){
    var b = e.target.closest('[data-mode]'); if (!b || b.dataset.mode === state.mode) return;
    state.mode = b.dataset.mode; save(); renderAll();
  });
  $('output').addEventListener('click', function(e){
    if (!e.target.closest('#set5Btn')) return;
    state.with5 = !state.with5; renderOutput();
    var o = $('overzicht'); if (o) o.scrollIntoView({ block: 'start' });
  });
  $('printBtn').addEventListener('click', function(){ window.print(); });

  // Acties in de setkaarten (veld, service, draaien, wissels) en het service-overzicht
  function keepScroll(fn){ var y = window.scrollY; fn(); window.scrollTo(0, y); }
  document.querySelector('main').addEventListener('click', function(e){
    var t, a;
    if ((t = e.target.closest('[data-rate]'))) {
      a = t.dataset.rate.split(':').map(Number);
      var card = $('set' + (a[0] + 1)), name = card.querySelector('.pos.on .pname').textContent;
      game.serves.push({ n: name, s: a[0], r: a[1] });
      ui.flash[a[0]] = name + ': ' + a[1] + ' (' + RATING[a[1]] + ')';
      if (navigator.vibrate) navigator.vibrate(15);
    } else if ((t = e.target.closest('[data-unscore]'))) {
      var us = +t.dataset.unscore;
      for (var k = game.serves.length - 1; k >= 0; k--) if (game.serves[k].s === us) { game.serves.splice(k, 1); break; }
      ui.flash[us] = '';
    } else if ((t = e.target.closest('[data-turn]'))) {
      var ts = +t.dataset.turn; setState(ts).t++; ui.flash[ts] = ''; ui.pick = null;
    } else if ((t = e.target.closest('[data-back]'))) {
      var bs = +t.dataset.back, g = setState(bs); if (g.t > 0) g.t--; ui.flash[bs] = ''; ui.pick = null;
    } else if ((t = e.target.closest('[data-phase]'))) {
      a = t.dataset.phase.split(':').map(Number); setState(a[0]).after = a[1] === 1; ui.pick = null;
    } else if ((t = e.target.closest('[data-tile]'))) {
      a = t.dataset.tile.split(':').map(Number);
      ui.pick = ui.pick && ui.pick.s === a[0] && ui.pick.slot === a[1] ? null : { s: a[0], slot: a[1] };
    } else if (e.target.closest('[data-cancel]')) {
      ui.pick = null;
    } else if ((t = e.target.closest('[data-in]'))) {
      var gp = setState(ui.pick.s); gp.swaps[gp.after ? 'a' : 'b'][ui.pick.slot] = +t.dataset['in']; ui.pick = null;
    } else if ((t = e.target.closest('#newGameBtn'))) {
      if (!confirmTap(t, 'Nieuwe wedstrijd')) return;
      var st = stats(game.serves);
      season.push({ date: new Date().toISOString().slice(0, 10), stats: st }); saveSeason();
      game.serves = []; game.sets = {}; ui = { pick: null, flash: {} }; saveGame(); renderAll();
      var s1 = $('set1'); if (s1) s1.scrollIntoView({ block: 'start' });
      return;
    } else return;
    saveGame(); keepScroll(renderOutput);
  });

  $('seasonBox').addEventListener('click', function(e){
    var t = e.target.closest('#clearSeason'); if (!t || !confirmTap(t, 'Seizoen wissen')) return;
    season = []; saveSeason(); renderSeason();
  });

  renderAll();
})();
</script>
</body>
</html>
